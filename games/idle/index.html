<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d2236">
<title>Кристальная шахта</title>
<style>
  :root{--panel:#0f2238;--item:#173250;--gold:#ffd25e;--txt:#eaf4ff;--mut:#8fb0cf;--acc:#5ad1ff}
  html,body{margin:0;height:100%;overflow:hidden;background:#06111f;color:var(--txt);touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif}
  button{font-family:inherit}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  #top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;align-items:flex-start;gap:10px;z-index:3;pointer-events:none}
  #top>*{pointer-events:auto}
  #money{flex:1;background:rgba(0,0,0,.32);border-radius:18px;padding:6px 12px 7px;backdrop-filter:blur(3px)}
  #coins{font-size:28px;font-weight:900;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.35);display:flex;align-items:center;gap:6px}
  #coins i{width:22px;height:22px;display:inline-block;background:linear-gradient(135deg,#bff3ff,#2fa8ff);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);flex:none}
  #rate{font-size:13px;color:var(--mut);font-weight:700}
  #loc{font-size:12px;color:var(--acc);font-weight:800;letter-spacing:.5px}
  .ib{width:46px;height:46px;border-radius:15px;border:0;background:rgba(0,0,0,.32);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(3px)}
  #stage{position:relative;flex:1;min-height:220px}
  #cv{position:absolute;inset:0;width:100%;height:100%}
  #chips{position:absolute;left:10px;right:10px;top:calc(84px + env(safe-area-inset-top));display:flex;gap:7px;justify-content:center;flex-wrap:wrap;z-index:2}
  .chip{padding:7px 11px;border-radius:14px;font-weight:800;font-size:13.5px;border:0;color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);white-space:nowrap}
  .chip:active{transform:translateY(2px)}
  .chip.ad{background:linear-gradient(#ffcf4a,#f29a18)} .chip.act{background:linear-gradient(#5be38a,#25b35c)}
  .chip.boss{background:linear-gradient(#ff7a5c,#d6352c);animation:pl .7s infinite alternate}
  .chip.q{background:linear-gradient(#6fd0ff,#2f7fff)} .chip.w{background:linear-gradient(#c58bff,#8a3fe0);animation:pl .9s infinite alternate}
  @keyframes pl{to{transform:scale(1.07)}}
  #panel{background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);
    height:44%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:2}
  #tabs{display:flex;padding:9px 8px 3px;gap:4px}
  .tab{flex:1;padding:7px 2px 6px;border-radius:12px;border:0;background:transparent;color:var(--mut);font-weight:800;font-size:12px;cursor:pointer;position:relative;line-height:1.2}
  .tab b{display:block;font-size:20px;line-height:1.1}
  .tab.on{background:rgba(255,255,255,.1);color:#fff}
  .tab .dot{position:absolute;top:3px;right:10%;width:10px;height:10px;border-radius:50%;background:#ff5e6e;display:none;box-shadow:0 0 6px #ff5e6e}
  .tab .dot.on{display:block}
  #list{flex:1;overflow-y:auto;padding:2px 10px 12px;-webkit-overflow-scrolling:touch}
  .lh{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 0;color:var(--mut);font-size:13px;font-weight:800}
  #mult{padding:6px 12px;border-radius:10px;border:0;background:#2a4e78;color:#fff;font-weight:900;cursor:pointer}
  .it{display:flex;align-items:center;gap:10px;background:var(--item);border-radius:16px;padding:9px 10px;margin-top:8px;position:relative;overflow:hidden}
  .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.08);flex:none}
  .in{flex:1;min-width:0}
  .in b{display:block;font-size:15px} .in span{font-size:12.5px;color:var(--mut);display:block}
  .in b .lv{display:inline-block;background:rgba(255,255,255,.14);border-radius:8px;padding:0 6px;margin-left:4px;font-size:12px;color:#fff;vertical-align:1px}
  .pg{height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:5px;overflow:hidden}
  .pg i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
  .buy{flex:none;min-width:88px;padding:9px 8px;border:0;border-radius:12px;font-weight:900;font-size:14px;color:#fff;
    background:linear-gradient(#5be38a,#25b35c);box-shadow:0 3px 0 #17803f;cursor:pointer;line-height:1.15}
  .buy:active{transform:translateY(2px);box-shadow:0 1px 0 #17803f}
  .buy.no{background:#33485f;box-shadow:0 3px 0 #253547;color:#93a8be}
  .buy.claim{background:linear-gradient(#ffcf4a,#f29a18);box-shadow:0 3px 0 #b5690a}
  .buy small{display:block;font-size:11px;opacity:.9;font-weight:800}
  .it.lock{opacity:.5} .it.lock .ic{filter:grayscale(1) brightness(.5)}
  .it.done{box-shadow:inset 0 0 0 2px var(--gold)}
  .world{border-radius:18px;padding:14px;margin-top:10px;position:relative;overflow:hidden;min-height:74px;display:flex;align-items:center;gap:12px}
  .world .wi{font-size:38px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
  .world b{font-size:17px;display:block} .world span{font-size:12.5px;opacity:.85;display:block}
  .world.cur{box-shadow:inset 0 0 0 3px var(--gold)}
  .world.lockw{filter:grayscale(.7) brightness(.7)}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,10,20,.75);backdrop-filter:blur(4px);z-index:10}
  .ov.on{display:flex;animation:fi .25s}
  @keyframes fi{from{opacity:0}}
  .card{width:min(86vw,360px);background:linear-gradient(#1d4670,#122d4a);border-radius:24px;padding:22px 20px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.7)}}
  .card h2{margin:0 0 8px} .card p{color:#b9d3ec;margin:6px 0;line-height:1.4}
  .big{font-size:38px;font-weight:900;color:var(--gold);margin:8px 0}
  .btn{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:16px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .btn:active{transform:translateY(2px)}
  .g{background:linear-gradient(#5be38a,#25b35c)} .y{background:linear-gradient(#ffcf4a,#f29a18)} .gr{background:rgba(255,255,255,.12)}
  .p{background:linear-gradient(#c58bff,#8a3fe0)} .r{background:linear-gradient(#ff7a5c,#d6352c)}
  .tg{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-size:17px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
  .sw{width:54px;height:30px;border-radius:15px;background:#555;position:relative;transition:.2s;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on{background:#25b35c} .sw.on::after{left:27px}
  .days{display:flex;gap:5px;justify-content:center;margin:12px 0}
  .days div{width:38px;padding:6px 0;border-radius:10px;background:rgba(255,255,255,.08);font-size:11px;color:var(--mut)}
  .days div.d{background:#25b35c;color:#fff} .days div.t{background:var(--gold);color:#3a2500;font-weight:900}
  #toast{position:fixed;left:50%;top:28%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:12px;
    font-size:15px;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="chips"></div>
  </div>
  <div id="top">
    <div id="money"><div id="coins"><i></i><span id="coinsV">0</span></div><div id="rate">0 / сек</div><div id="loc"></div></div>
    <button class="ib" id="bSet" aria-label="Настройки">⚙️</button>
  </div>
  <div id="panel">
    <div id="tabs">
      <button class="tab on" data-t="gen"><b>⛏</b>Шахта<i class="dot"></i></button>
      <button class="tab" data-t="upg"><b>⚡</b>Улучшения<i class="dot" id="dUpg"></i></button>
      <button class="tab" data-t="q"><b>📜</b>Задания<i class="dot" id="dQ"></i></button>
      <button class="tab" data-t="w"><b>🌍</b>Миры<i class="dot" id="dW"></i></button>
    </div>
    <div id="list"></div>
  </div>
</div>

<div class="ov" id="ovOff"><div class="card">
  <h2>С возвращением!</h2><p>Пока тебя не было, шахтёры добыли:</p>
  <div class="big" id="offAmt">0</div>
  <button class="btn y" id="bOffAd">▶ Забрать x3 за рекламу</button>
  <button class="btn gr" id="bOff">Забрать</button>
</div></div>
<div class="ov" id="ovDaily"><div class="card">
  <h2>Ежедневная награда</h2><p>Заходи каждый день — награда растёт!</p>
  <div class="days" id="days"></div><div class="big" id="dailyAmt">0</div>
  <button class="btn g" id="bDaily">Забрать</button>
</div></div>
<div class="ov" id="ovSet"><div class="card">
  <h2>Настройки</h2>
  <div class="tg" data-k="sound">Звуки <div class="sw"></div></div>
  <div class="tg" data-k="music">Музыка <div class="sw"></div></div>
  <div class="tg" data-k="vibro">Вибрация <div class="sw"></div></div>
  <p id="stats" style="font-size:13px;margin-top:14px"></p>
  <button class="btn g" id="bSetOk">Готово</button>
</div></div>
<div class="ov" id="ovMsg"><div class="card" id="msgCard"></div></div>
<div class="ov" id="ovAd"><div class="card"><h2>Реклама</h2><p>Тестовый показ…</p></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= Хранилище ================= */
const Store={
  get(k,d){try{const v=localStorage.getItem("cm_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("cm_"+k,JSON.stringify(v))}catch(e){}}
};
const settings=Object.assign({sound:true,music:true,vibro:true},Store.get("settings",{}));
const $=id=>document.getElementById(id);

/* ================= Реклама ================= */
const Ads=(function(){
  const platform= window.AndroidAds ? "android" : (/vk_app_id=/.test(location.search) ? "vk" : "web");
  let bridge=null,lastInter=Date.now(),busy=false; const pending={}; let seq=0;
  window.__adResult=function(id,ok){if(pending[id]){pending[id](!!ok);delete pending[id];}};
  async function show(kind){
    if(busy) return false; busy=true; Sound.suspend(); let ok=false;
    try{
      if(platform==="vk"&&bridge){const r=await bridge.send("VKWebAppShowNativeAds",{ad_format:kind==="reward"?"reward":"interstitial"});ok=!!(r&&r.result);}
      else if(platform==="android"){ok=await new Promise(res=>{const id=++seq;pending[id]=res;
          kind==="reward"?window.AndroidAds.showRewarded(id):window.AndroidAds.showInterstitial(id);
          setTimeout(()=>{if(pending[id]){pending[id](false);delete pending[id]}},60e3);});}
      else{const o=$("ovAd");o.classList.add("on");await new Promise(r=>setTimeout(r,1100));o.classList.remove("on");ok=true;}
    }catch(e){ok=false}
    busy=false; Sound.resume(); return ok;
  }
  return{platform,
    init(){ if(platform!=="vk") return;
      const s=document.createElement("script");s.src="vk-bridge.min.js";
      s.onload=()=>{bridge=window.vkBridge;try{bridge.send("VKWebAppInit")}catch(e){}};document.head.appendChild(s);},
    rewarded(){return show("reward")},
    async interstitial(){if(Date.now()-lastInter<180e3)return false;const ok=await show("inter");if(ok)lastInter=Date.now();return ok;}
  };
})();

/* ================= Миры ================= */
const WORLDS=[
  {name:"Хрустальная пещера",ic:"💎",shape:"octa",hue:195,sat:85,bg:["#164a6e","#071522"],rock:"#0b2a40",rock2:"#123a56",fx:"dust",acc:"#5ad1ff",key:0},
  {name:"Ледяной грот",ic:"🧊",shape:"spire",hue:188,sat:60,bg:["#3a7aa8","#0b2338"],rock:"#1d4a6c",rock2:"#2c628a",fx:"snow",acc:"#bff3ff",key:-2},
  {name:"Огненные недра",ic:"🌋",shape:"ruby",hue:355,sat:85,bg:["#5a1a10","#120403"],rock:"#2a0a06",rock2:"#3d120a",fx:"ember",acc:"#ff8a5c",key:-5},
  {name:"Изумрудные руины",ic:"🌿",shape:"emerald",hue:145,sat:75,bg:["#12503a","#03130c"],rock:"#08281b",rock2:"#0f3a27",fx:"firefly",acc:"#6dffb0",key:3},
  {name:"Звёздная бездна",ic:"🌌",shape:"star",hue:275,sat:80,bg:["#2a1560","#04020d"],rock:"#140b33",rock2:"#211347",fx:"stars",acc:"#c99bff",key:-3},
];
const WORLD_COST=[0,2e6,5e9,2e13,1e17];   // сколько кристаллов нужно, чтобы переехать
const WORLD_MULT=k=>Math.pow(6,k);         // постоянный множитель мира

/* ================= Звук ================= */
const Sound=(function(){
  let ac=null,master,musicGain,timer,step=0,nbuf;
  const N=n=>440*Math.pow(2,(n-69)/12);
  function tone(f,t0,dur,type,vol,dest,slide){const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";
    o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+.05);}
  function noise(t0,dur,vol,type,freq){const s=ac.createBufferSource();s.buffer=nbuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;
    const g=ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur);}
  const prog=[[50,57,62,65],[46,53,58,62],[48,55,60,64],[45,52,57,61]];
  function music(){ if(timer)return; let next=ac.currentTime+.1;
    timer=setInterval(()=>{if(ac.state!=="running")return;const k=WORLDS[S.world].key,bt=boss?.26:.36;
      while(next<ac.currentTime+1.2){const ch=prog[Math.floor(step/16)%4],i=step%16;
        if(i===0)tone(N(ch[0]-12+k),next,bt*14,"sine",.12,musicGain);
        if(i%4===0)tone(N(ch[1+(i/4)%3]+k),next,bt*4,"sine",.04,musicGain);
        const pat=[0,3,6,8,11,14];if(pat.includes(i))tone(N(ch[[1,2,3,2,3,1][pat.indexOf(i)]]+12+k),next,bt*2,"triangle",.04,musicGain);
        if(boss&&i%2===0)tone(N(ch[0]-24+k),next,bt*.8,"square",.03,musicGain);
        step++;next+=bt;}},250);}
  function vib(ms){if(settings.vibro&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
  let lastTap=0;const ok=()=>ac&&settings.sound;
  return{
    unlock(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
      master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
      musicGain=ac.createGain();musicGain.gain.value=settings.music?.2:0;musicGain.connect(master);
      nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;music();}
      if(ac.state==="suspended"&&!document.hidden)ac.resume();},
    suspend(){if(ac)ac.suspend()}, resume(){if(ac&&!document.hidden)ac.resume()},
    setMusic(on){if(musicGain)musicGain.gain.setTargetAtTime(on?.2:0,ac.currentTime,.3)},
    tap(){if(!ok())return;const t=ac.currentTime;if(t-lastTap<.03)return;lastTap=t;const k=WORLDS[S.world].key+(fever>0?5:0);
      const f=[76,79,81,83,86][Math.floor(Math.random()*5)]+k;tone(N(f),t,.18,"triangle",.14);tone(N(f+12),t,.08,"sine",.05);vib(8);},
    hit(){if(!ok())return;const t=ac.currentTime;if(t-lastTap<.03)return;lastTap=t;noise(t,.12,.35,"bandpass",500+Math.random()*400);tone(110,t,.12,"triangle",.25,null,60);vib(15);},
    crack(){if(!ok())return;const t=ac.currentTime;noise(t,.6,.6,"lowpass",900);tone(90,t,.5,"sine",.4,null,35);vib(200);},
    buy(){if(!ok())return;const t=ac.currentTime;tone(N(72),t,.1,"square",.06);tone(N(79),t+.06,.18,"square",.06);vib(15);},
    no(){if(!ok())return;tone(180,ac.currentTime,.12,"sawtooth",.05,null,130);},
    reward(){if(!ok())return;const t=ac.currentTime;[72,76,79,84,88,91].forEach((n,i)=>tone(N(n),t+i*.07,.4,"triangle",.16));vib(40);},
    gold(){if(!ok())return;const t=ac.currentTime;[84,88,91,96].forEach((n,i)=>tone(N(n),t+i*.05,.3,"sine",.12));},
    fever(){if(!ok())return;const t=ac.currentTime;[60,64,67,72,76,79,84].forEach((n,i)=>tone(N(n),t+i*.04,.3,"sawtooth",.05));noise(t,.5,.15,"highpass",4000);vib(60);},
    world(){if(!ok())return;const t=ac.currentTime;[60,67,72,76,79,84,88,91,96].forEach((n,i)=>tone(N(n),t+i*.09,.6,"triangle",.14));}
  };
})();

/* ================= Числа ================= */
const SUF=["","К","М","Млрд","Трлн","Квдр","Квнт","Скст","Сптл","Октл","Нонл","Дцлн","Ундц","Дуодц"];
function fmt(n){
  if(!isFinite(n)) return "∞";
  if(n<1000) return n<10&&n%1? n.toFixed(1): Math.floor(n).toString();
  let i=0; while(n>=1000&&i<SUF.length-1){n/=1000;i++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+" "+SUF[i];
}
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+" ч "+m+" мин":m?m+" мин "+(s%60)+" с":s+" с";}

/* ================= Экономика ================= */
const GENS=[
  {ic:"🧑‍🏭",n:"Шахтёр",cost:15,inc:.2},
  {ic:"🛒",n:"Вагонетка",cost:120,inc:1.4},
  {ic:"🐴",n:"Пони-тягач",cost:1100,inc:9},
  {ic:"⚙️",n:"Бур",cost:13000,inc:55},
  {ic:"💥",n:"Динамит",cost:150000,inc:330},
  {ic:"🚂",n:"Рудный поезд",cost:1.8e6,inc:2000},
  {ic:"🏭",n:"Обогатительный завод",cost:2.2e7,inc:12500},
  {ic:"🛸",n:"Лазерный экскаватор",cost:3e8,inc:80000},
  {ic:"🌋",n:"Магматический насос",cost:4.2e9,inc:520000},
  {ic:"🌀",n:"Портал в ядро",cost:6e10,inc:3.5e6},
];
const GROW=1.15;
const UPGS=[];
GENS.forEach((g,gi)=>[10,25,50,100].forEach((need,k)=>UPGS.push({id:"g"+gi+"u"+need,ic:g.ic,gen:gi,need,
  n:["Каски","Перчатки","Фонари","Алмазные кирки"][k]+": "+g.n.toLowerCase(),d:"Доход «"+g.n+"» ×2",cost:g.cost*need*[10,30,100,500][k]})));
[[1,"Крепкий палец",50],[25,"Каменный кулак",5000],[100,"Стальной кулак",5e5],[300,"Алмазный кулак",5e7],[1000,"Кулак титана",5e9]]
  .forEach(([tp,n,c])=>UPGS.push({id:"tap"+tp,ic:"👊",tap:true,n,d:"Клик +1% от дохода в секунду",cost:c,need:0}));
UPGS.push({id:"fev1",ic:"🔥",n:"Жаркая лихорадка",d:"Лихорадка длится на 4 с дольше",cost:2e4,fev:1});
UPGS.push({id:"fev2",ic:"🔥",n:"Пламенная лихорадка",d:"Клик в лихорадке ×5 вместо ×3",cost:3e6,fev:2});
UPGS.push({id:"gold1",ic:"✨",n:"Золотое чутьё",d:"Золотые кристаллы появляются чаще",cost:5e4,gold:1});
UPGS.push({id:"boss1",ic:"⛏️",n:"Отбойный молоток",d:"Удар по глыбе ×2",cost:1e5,boss:1});
UPGS.sort((a,b)=>a.cost-b.cost);

const fresh=()=>({coins:0,total:0,lifetime:0,tapLv:0,gens:GENS.map(()=>0),upgs:{},shards:0,world:0,maxWorld:0,last:Date.now(),

S.st=Object.assign(fresh().st,S.st||{});
if(!S.gens||S.gens.length<GENS.length) S.gens=GENS.map((_,i)=>(S.gens&&S.gens[i])||0);

function genMult(i){let m=1;for(const u of UPGS) if(u.gen===i&&S.upgs[u.id]) m*=2; return m;}
const boostActive=()=>Date.now()<S.boostUntil;
function globalMult(){return (1+S.shards*0.1)*WORLD_MULT(S.world)*(boostActive()?2:1);}
const genRate=i=>GENS[i].inc*S.gens[i]*genMult(i);
function rate(){let r=0;for(let i=0;i<GENS.length;i++) r+=genRate(i);return r*globalMult();}
function baseTap(){
  let pct=0;for(const u of UPGS) if(u.tap&&S.upgs[u.id]) pct+=0.01;
  return (1+S.tapLv)*Math.pow(1.5,Math.floor(S.tapLv/10))*globalMult()+rate()*pct;
}
const feverMult=()=>fever>0?(S.upgs.fev2?5:3):1;
const tapValue=()=>baseTap()*feverMult();
const tapCost=()=>Math.floor(10*Math.pow(1.13,S.tapLv))*Math.max(1,WORLD_MULT(S.world)/3);
function genCost(i,n){const b=GENS[i].cost*Math.pow(GROW,S.gens[i])*WORLD_MULT(S.world)/Math.pow(2,S.world);return b*(Math.pow(GROW,n)-1)/(GROW-1);}
function maxAfford(i){const b=GENS[i].cost*Math.pow(GROW,S.gens[i])*WORLD_MULT(S.world)/Math.pow(2,S.world);
  return Math.max(0,Math.floor(Math.log(S.coins*(GROW-1)/b+1)/Math.log(GROW)));}
const upgCost=u=>u.cost*WORLD_MULT(S.world)/Math.pow(2,S.world);
function earn(v){S.coins+=v;S.total+=v;S.lifetime+=v;}
const shardsFor=()=>Math.floor(Math.sqrt(S.total/1e7));

const QT=[
  {t:"taps",ic:"👆",txt:n=>"Сделай "+n+" кликов",base:120,grow:1.25},
  {t:"bought",ic:"🧑‍🏭",txt:n=>"Найми "+n+" работников",base:10,grow:1.2},
  {t:"bosses",ic:"🪨",txt:n=>"Разбей глыб: "+n,base:1,grow:1.15},
  {t:"golds",ic:"✨",txt:n=>"Поймай золотых кристаллов: "+n,base:1,grow:1.12},
  {t:"upg",ic:"⚡",txt:n=>"Купи улучшений: "+n,base:2,grow:1.12},
  {t:"fevers",ic:"🔥",txt:n=>"Включи лихорадку: "+n+" раз",base:1,grow:1.15},
];
function newQuest(avoid){
  const pool=QT.filter(q=>!avoid.includes(q.t));const q=pool[Math.floor(Math.random()*pool.length)];
  const need=Math.max(1,Math.round(q.base*Math.pow(q.grow,S.qLevel)));
  return{t:q.t,need,start:S.st[q.t]};
}
function ensureQuests(){while(S.quests.length<3)S.quests.push(newQuest(S.quests.map(q=>q.t)));}
const qProg=q=>Math.min(q.need,S.st[q.t]-q.start);
const qDone=q=>qProg(q)>=q.need;
const qReward=()=>Math.max(200,rate()*150+baseTap()*80)*(1+S.qLevel*.05);
function claimQuest(i){
  const q=S.quests[i];if(!q||!qDone(q))return;
  const r=qReward();earn(r);S.qLevel++;S.quests.splice(i,1);ensureQuests();
  Sound.reward();toast("Задание выполнено! +"+fmt(r));burstAtCrystal(30);save();render(true);
}

  if(S.world===4){const ng=ctx.createRadialGradient(W*.8,H*.2,5,W*.8,H*.2,W*.6);ng.addColorStop(0,"rgba(255,100,220,.18)");ng.addColorStop(1,"rgba(255,100,220,0)");ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);}

  if(S.world===3){ctx.strokeStyle="rgba(60,160,90,.6)";ctx.lineWidth=3;for(let i=0;i<rocks.top.length;i+=3){const [x,h]=rocks.top[i];ctx.beginPath();ctx.moveTo(x+8,0);
    ctx.bezierCurveTo(x+20,h,x-10,h*1.6,x+6+Math.sin(t*.001+i)*6,h*2.2);ctx.stroke();ctx.fillStyle="rgba(80,200,110,.7)";ctx.beginPath();ctx.ellipse(x+6+Math.sin(t*.001+i)*6,h*2.2,5,3,.6,0,7);ctx.fill();}}
  // земля
  ctx.fillStyle=w.rock;ctx.beginPath();ctx.moveTo(0,H);for(const [x,h] of rocks.bot)ctx.lineTo(x,groundY-h*.4);ctx.lineTo(W,groundY);ctx.lineTo(W,H);ctx.fill();
  ctx.fillStyle=w.rock;ctx.fillRect(0,groundY,W,H-groundY);
  // рельсы
  ctx.strokeStyle="rgba(150,110,70,.85)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,groundY+6);ctx.lineTo(W,groundY+6);ctx.stroke();
  ctx.fillStyle="rgba(110,75,45,.9)";for(let x=-((t*.0)%22);x<W;x+=22)ctx.fillRect(x,groundY+7,12,4);

    else if(w.fx==="ember"){p.y-=.5+p.v*1.4;p.x+=Math.sin(t*.002+p.p)*.6;if(p.y<0){p.y=H;p.x=Math.random()*W;}ctx.fillStyle="hsla("+(20+p.v*25)+",100%,60%,"+(.4+p.v*.5)+")";ctx.fillRect(p.x,p.y,2+p.v*2,2+p.v*2);}
    else if(w.fx==="firefly"){p.x+=Math.sin(t*.0007+p.p*3)*.5;p.y+=Math.cos(t*.0009+p.p*2)*.4;if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      const a=.3+.7*Math.max(0,Math.sin(t*.003+p.p*5));ctx.fillStyle="rgba(200,255,120,"+a*.25+")";ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.fillStyle="rgba(230,255,150,"+a+")";ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,7);ctx.fill();}
    else if(w.fx==="stars"){const a=.3+.7*Math.abs(Math.sin(t*.0015+p.p*7));ctx.fillStyle="rgba(255,255,255,"+a+")";ctx.fillRect(p.x,p.y*.85,1+p.v*1.6,1+p.v*1.6);}
    else{p.y-=.15+p.v*.25;if(p.y<0){p.y=H;p.x=Math.random()*W;}ctx.fillStyle=hsl(w.hue,60,80,.15+p.v*.3);ctx.beginPath();ctx.arc(p.x,p.y,.8+p.v*1.8,0,7);ctx.fill();}

/* ---- формы кристаллов ---- */
function poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();}
function facetFill(pts,h,s,l){poly(pts);ctx.fillStyle=hsl(h,s,l);ctx.fill();ctx.strokeStyle=hsl(h,100,92,.45);ctx.lineWidth=1.3;ctx.stroke();}
function crystalOutline(shape,r){
  if(shape==="octa"){const p=[];for(let i=0;i<8;i++){const a=i/8*Math.PI*2-Math.PI/2,k=i%2?.78:1;p.push([Math.cos(a)*r*k,Math.sin(a)*r*k]);}return p;}
  if(shape==="ruby"){const p=[];for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2;p.push([Math.cos(a)*r,Math.sin(a)*r*.95]);}return p;}
  if(shape==="emerald"){const w=r*.72,h=r,c=r*.28;return[[-w+c,-h],[w-c,-h],[w,-h+c],[w,h-c],[w-c,h],[-w+c,h],[-w,h-c],[-w,-h+c]];}
  if(shape==="star"){const p=[];for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,k=i%2?.48:1;p.push([Math.cos(a)*r*k,Math.sin(a)*r*k]);}return p;}
  return [[-r*.75,r],[-r*.75,-r*.3],[0,-r*1.1],[r*.75,-r*.3],[r*.75,r]];
}
function drawGemShape(shape,r,h,s,t){
  const pulse=Math.sin(t*.002);
  if(shape==="spire"){
    const prism=(x,w,top,bot,l)=>{facetFill([[x-w,bot],[x-w,top+w*.6],[x,top],[x,bot]],h,s,l);facetFill([[x,bot],[x,top],[x+w,top+w*.6],[x+w,bot]],h,s,l+14);
      poly([[x-w,top+w*.6],[x,top],[x+w,top+w*.6],[x,top+w*1.1]]);ctx.fillStyle=hsl(h,s,l+28);ctx.fill();};
    prism(-r*.62,r*.26,-r*.25,r*.9,48);prism(r*.62,r*.24,-r*.1,r*.9,46);prism(0,r*.36,-r*1.05,r*.95,52+pulse*4);
    return;
  }
  const out=crystalOutline(shape,r);
  if(shape==="emerald"){
    out.forEach((p,i)=>{const q=out[(i+1)%out.length];facetFill([[0,0],p,q],h,s,40+((i*3)%4)*7+pulse*3);});
    const k=.62;facetFill(out.map(p=>[p[0]*k,p[1]*k]),h,s,52);const k2=.34;facetFill(out.map(p=>[p[0]*k2,p[1]*k2]),h,s,64);
    return;
  }
  for(let i=0;i<out.length;i++){const a=out[i],b=out[(i+1)%out.length];
    const l=42+((i*37)%5)*7+8*Math.sin(t*.002+i);facetFill([[0,0],a,b],h,s,l);}
  const k=shape==="star"?.36:.45;poly(out.map(p=>[p[0]*k,p[1]*k]));ctx.fillStyle=hsl(h,100,88,.35);ctx.fill();
  if(shape==="ruby"){for(let i=0;i<10;i+=2){const a=out[i];ctx.strokeStyle=hsl(h,100,90,.35);ctx.beginPath();ctx.moveTo(a[0]*k,a[1]*k);ctx.lineTo(a[0],a[1]);ctx.stroke();}}
}
function drawCrystal(t){
  const w=WORLDS[S.world],h=w.hue+(fever>0?Math.sin(t*.01)*30:0),s=1+squash*.12,bob=Math.sin(t*.002)*R*.04;
  ctx.save();ctx.translate(cx,cy+bob);
  // тень и подставка
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(0,R*1.08-bob,R*.8,R*.13,0,0,7);ctx.fill();
  const gl=ctx.createRadialGradient(0,0,R*.2,0,0,R*1.9);gl.addColorStop(0,hsl(h,90,65,fever>0?.6:.42));gl.addColorStop(1,hsl(h,90,50,0));
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,R*1.9,0,7);ctx.fill();
  ctx.scale(1/s*1.08+(s-1)*.2,s);ctx.rotate(Math.sin(t*.0007)*.06);
  drawGemShape(w.shape,R,h,w.sat,t);
  // бегущий блик
  const out=crystalOutline(w.shape==="spire"?"octa":w.shape,R*1.05),sw=((t*.00035)%2.4)-.7;
  ctx.save();poly(out);ctx.clip();ctx.fillStyle="rgba(255,255,255,.3)";ctx.beginPath();
  ctx.moveTo((sw-.2)*R*2,-R*1.2);ctx.lineTo(sw*R*2,-R*1.2);ctx.lineTo((sw-.3)*R*2,R*1.2);ctx.lineTo((sw-.5)*R*2,R*1.2);ctx.fill();ctx.restore();
  // искорки на гранях
  for(let i=0;i<3;i++){const a=t*.001+i*2.1,k=(Math.sin(t*.004+i*3)*.5+.5);if(k<.7)continue;const x=Math.cos(a)*R*.5,y=Math.sin(a*1.3)*R*.5,z=(k-.7)*3.3*R*.12;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(x,y-z);ctx.lineTo(x+z*.25,y);ctx.lineTo(x,y+z);ctx.lineTo(x-z*.25,y);ctx.fill();ctx.beginPath();ctx.moveTo(x-z,y);ctx.lineTo(x,y+z*.25);ctx.lineTo(x+z,y);ctx.lineTo(x,y-z*.25);ctx.fill();}
  ctx.restore();squash*=.82;
}
function drawBoss(t){
  const hpk=boss.hp/boss.max,shk=crackT>0?(Math.random()-.5)*8*crackT:0;crackT*=.85;
  ctx.save();ctx.translate(cx+shk,cy+R*.15);const r=R*1.05,s=1+squash*.08;ctx.scale(s,1/s);
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(0,r*.9,r*.95,r*.15,0,0,7);ctx.fill();
  const pts=boss.shape.map(([a,k])=>[Math.cos(a)*r*k,Math.sin(a)*r*k*.85]);
  const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r*1.1);g.addColorStop(0,"#9b8f86");g.addColorStop(1,"#3e3632");
  poly(pts);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="#2a2420";ctx.lineWidth=3;ctx.stroke();
  // вкрапления кристаллов мира
  const w=WORLDS[S.world];boss.gems.forEach(([a,k,z])=>{ctx.save();ctx.translate(Math.cos(a)*r*k,Math.sin(a)*r*k*.8);ctx.rotate(a);
    poly([[0,-z],[z*.6,0],[0,z],[-z*.6,0]]);ctx.fillStyle=hsl(w.hue,w.sat,60+Math.sin(t*.005+a)*10);ctx.fill();ctx.restore();});
  // трещины по мере урона
  ctx.strokeStyle="rgba(20,15,10,.85)";ctx.lineWidth=2.5;ctx.lineCap="round";
  const n=Math.floor((1-hpk)*boss.cracks.length);
  for(let i=0;i<n;i++){const c=boss.cracks[i];ctx.beginPath();c.forEach((p,j)=>j?ctx.lineTo(p[0]*r,p[1]*r):ctx.moveTo(p[0]*r,p[1]*r));ctx.stroke();
    ctx.strokeStyle=hsl(w.hue,100,70,.6);ctx.lineWidth=1;ctx.stroke();ctx.strokeStyle="rgba(20,15,10,.85)";ctx.lineWidth=2.5;}
  // глаза у глыбы
  const blink=(Math.floor(t/2500)%5===0&&t%2500<160);ctx.fillStyle="#fff";
  [-1,1].forEach(sd=>{ctx.beginPath();ctx.ellipse(sd*r*.25,-r*.12,r*.1,blink?r*.015:r*.12,0,0,7);ctx.fill();
    if(!blink){ctx.fillStyle="#111";ctx.beginPath();ctx.arc(sd*r*.25+Math.sin(t*.002)*r*.03,-r*.1,r*.05,0,7);ctx.fill();ctx.fillStyle="#fff";}});
  ctx.strokeStyle="#1a1410";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-r*.38,-r*.32);ctx.lineTo(-r*.12,-r*.24);ctx.moveTo(r*.38,-r*.32);ctx.lineTo(r*.12,-r*.24);ctx.stroke();
  ctx.restore();
  // полоска HP и таймер
  const bw=Math.min(W*.7,300),bx=cx-bw/2,by=cy-R*1.35;
  ctx.fillStyle="rgba(0,0,0,.5)";rrect(bx,by,bw,16,8);ctx.fill();ctx.fillStyle="#ff5e4e";rrect(bx,by,Math.max(16,bw*hpk),16,8);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="900 12px Trebuchet MS, Arial";ctx.textAlign="center";ctx.fillText("Глыба · "+Math.ceil(boss.hp)+" / "+boss.max,cx,by+12);
  const tl=Math.max(0,(boss.end-Date.now())/1000);ctx.font="900 20px Trebuchet MS, Arial";ctx.fillStyle=tl<5?"#ff5e4e":"#fff";
  ctx.fillText(tl.toFixed(1)+" с",cx,by-8);
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---- шахтёры и вагонетки ---- */
const SHIRTS=["#e2553f","#3f86e2","#4cb050","#e2a33f","#9b59d0","#e04f8f","#2fb5b0","#c9c9c9"];
function syncCrew(){
  const nm=Math.min(8,S.gens[0]>0?1+Math.floor(Math.log2(S.gens[0]+1)*1.5):0);
  while(miners.length<nm){const i=miners.length,side=i%2?1:-1,slot=Math.floor(i/2);
    miners.push({side,dist:R*.95+slot*28+Math.random()*8,ph:Math.random()*6,spd:.006+Math.random()*.004,shirt:SHIRTS[i%SHIRTS.length]});}
  miners.length=nm;
  const nc=Math.min(3,S.gens[1]>0?1+Math.floor(S.gens[1]/15):0);
  while(carts.length<nc)carts.push({x:Math.random()*W,v:(Math.random()<.5?-1:1)*(.6+Math.random()*.6)});
  carts.length=nc;
}
function drawMiner(m,t){
  const x=cx+m.side*m.dist,y=groundY,f=-m.side; // смотрит на кристалл
  const sw=Math.sin(t*m.spd+m.ph),hitNow=sw>.95;
  ctx.save();ctx.translate(x,y);ctx.scale(f,1);
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(0,0,11,3,0,0,7);ctx.fill();
  ctx.fillStyle="#3b3b4f";ctx.fillRect(-6,-12,4,12);ctx.fillRect(1,-12,4,12);          // ноги
  ctx.fillStyle=m.shirt;rrect(-8,-27,16,17,5);ctx.fill();                              // тело
  ctx.fillStyle="#f2c79c";ctx.beginPath();ctx.arc(0,-33,7,0,7);ctx.fill();              // голова
  ctx.fillStyle="#ffd23e";ctx.beginPath();ctx.arc(0,-35,8,Math.PI,0);ctx.fill();ctx.fillRect(-9,-36,18,3); // каска
  ctx.fillStyle="#fff7c2";ctx.beginPath();ctx.arc(7,-37,2.4,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,240,170,.18)";ctx.beginPath();ctx.moveTo(8,-37);ctx.lineTo(40,-52);ctx.lineTo(40,-24);ctx.fill();
  // кирка
  ctx.save();ctx.translate(4,-22);ctx.rotate(-1.3+ (sw*.5+.5)*1.7);
  ctx.strokeStyle="#8a5a30";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(18,0);ctx.stroke();
  ctx.strokeStyle="#c9d0dc";ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(18,0,8,-1.3,1.3);ctx.stroke();ctx.restore();
  ctx.restore();
  if(hitNow&&Math.random()<.4){const w=WORLDS[S.world];for(let i=0;i<2;i++)parts.push({x:x+f*22,y:y-26,vx:f*(1+Math.random()*2),vy:-2-Math.random()*2,life:.7,s:3,r:0,c:hsl(w.hue,90,75)});}
}
function drawCart(c,t){
  c.x+=c.v;if(c.x<20||c.x>W-20)c.v*=-1;const y=groundY+2,w=WORLDS[S.world];
  ctx.save();ctx.translate(c.x,y);
  ctx.fillStyle="#5d5f6b";ctx.beginPath();ctx.moveTo(-18,-16);ctx.lineTo(18,-16);ctx.lineTo(14,0);ctx.lineTo(-14,0);ctx.fill();
  ctx.fillStyle="#7a7d8c";ctx.fillRect(-18,-17,36,3);
  for(let i=0;i<4;i++){ctx.fillStyle=hsl(w.hue,w.sat,55+i*8);ctx.beginPath();const px=-10+i*7;ctx.moveTo(px,-16);ctx.lineTo(px+4,-24-(i%2)*4);ctx.lineTo(px+8,-16);ctx.fill();}
  ctx.fillStyle="#222";[-9,9].forEach(px=>{ctx.beginPath();ctx.arc(px,1,4,0,7);ctx.fill();});
  ctx.restore();
}

/* ---- эффекты и цикл ---- */
function burstAtCrystal(n){const w=WORLDS[S.world];for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=3+Math.random()*7;
  parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,s:4+Math.random()*6,r:0,c:hsl(w.hue+Math.random()*40-20,90,65+Math.random()*25)});}}
function draw(t){
  drawBg(t);
  syncCrew();for(const c of carts)drawCart(c,t);
  if(boss)drawBoss(t);else drawCrystal(t);
  for(const m of miners)drawMiner(m,t);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life-=.025;
    if(p.life<=0){parts.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.r+=.1);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.moveTo(0,-p.s);ctx.lineTo(p.s*.7,0);ctx.lineTo(0,p.s);ctx.lineTo(-p.s*.7,0);ctx.fill();ctx.restore();}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=1.1;f.life-=.02;if(f.life<=0){floats.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,f.life*2);ctx.font="900 "+f.sz+"px Trebuchet MS, Arial";ctx.textAlign="center";
    ctx.lineWidth=5;ctx.lineJoin="round";ctx.strokeStyle="rgba(0,15,30,.85)";ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y);ctx.globalAlpha=1;}
  // золотой кристалл
  const overlay=!!document.querySelector(".ov.on");
  if(!gold&&!boss&&Date.now()>nextGold&&!overlay){gold={x:W*(.15+Math.random()*.7),y:H*(.32+Math.random()*.2),born:Date.now()};}
  if(gold){const age=(Date.now()-gold.born)/1000;if(age>10){gold=null;scheduleGold();}
    else{const s=18+Math.sin(t*.01)*3;ctx.save();ctx.translate(gold.x,gold.y+Math.sin(t*.004)*6);ctx.globalAlpha=age>8?(10-age)/2:1;
      ctx.shadowColor="#ffd25e";ctx.shadowBlur=25;ctx.fillStyle="#ffd25e";ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.75,0);ctx.lineTo(0,s);ctx.lineTo(-s*.75,0);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle="#fff7d1";ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.3,0);ctx.lineTo(0,s*.3);ctx.lineTo(-s*.3,0);ctx.fill();ctx.restore();}}
  // шкала лихорадки
  const fw=Math.min(W*.5,220),fx=cx-fw/2,fy=groundY-56;
  ctx.fillStyle="rgba(0,0,0,.45)";rrect(fx,fy,fw,10,5);ctx.fill();
  const fk=fever>0?fever/feverDur():feverMeter;
  const fg=ctx.createLinearGradient(fx,0,fx+fw,0);fg.addColorStop(0,"#ffcf4a");fg.addColorStop(1,"#ff4e3a");ctx.fillStyle=fg;
  if(fk>0){rrect(fx,fy,Math.max(10,fw*fk),10,5);ctx.fill();}
  ctx.font="900 12px Trebuchet MS, Arial";ctx.textAlign="center";ctx.fillStyle=fever>0?"#ffcf4a":"rgba(255,255,255,.75)";
  ctx.fillText(fever>0?"🔥 ЛИХОРАДКА ×"+(S.upgs.fev2?5:3)+"!":"🔥 Лихорадка",cx,fy-4);
}
const scheduleGold=()=>{nextGold=Date.now()+(S.upgs.gold1?45e3:75e3)+Math.random()*60e3;};
const feverDur=()=>8+(S.upgs.fev1?4:0);

function tapAt(x,y){
  Sound.unlock();
  if(gold&&Math.hypot(x-gold.x,y-(gold.y))<44){openGold();return;}
  if(Math.hypot(x-cx,y-cy)>R*1.3) return;
  const w=WORLDS[S.world];
  if(boss){
    const dmg=(S.upgs.boss1?2:1)*(fever>0?2:1);boss.hp=Math.max(0,boss.hp-dmg);squash=1;crackT=1;Sound.hit();S.st.taps++;
    for(let i=0;i<5;i++){const a=Math.random()*6.28,sp=3+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,s:3+Math.random()*5,r:0,c:Math.random()<.7?"#8a7f76":hsl(w.hue,90,65)});}
    floats.push({t:"-"+dmg,x:x+(Math.random()-.5)*30,y:y-20,life:1,sz:22,c:"#ffb4a8"});
    if(boss.hp<=0)bossWin();return;
  }
  const v=tapValue();earn(v);S.st.taps++;squash=1;Sound.tap();
  if(fever<=0){feverMeter=Math.min(1,feverMeter+1/45);if(feverMeter>=1){fever=feverDur();feverMeter=0;S.st.fevers++;Sound.fever();burstAtCrystal(40);toast("🔥 Лихорадка! Клик ×"+(S.upgs.fev2?5:3));}}
  for(let i=0;i<6;i++){const a=Math.random()*6.28,sp=3+Math.random()*5;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,s:4+Math.random()*5,r:0,c:hsl(w.hue+Math.random()*40-20,90,60+Math.random()*25)});}
  floats.push({t:"+"+fmt(v),x:x+(Math.random()-.5)*30,y:y-20,life:1,sz:fever>0?26:21,c:fever>0?"#ffcf4a":"#fff"});
  if(floats.length>22)floats.shift();if(parts.length>320)parts.splice(0,parts.length-320);
}
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();tapAt(e.clientX-r.left,e.clientY-r.top);});

/* ================= Глыба-босс ================= */
const BOSS_EVERY=150e3;
function bossReady(){return !boss&&Date.now()>=S.bossAt&&S.gens[0]>0;}
function startBoss(){
  if(!bossReady())return;Sound.unlock();
  const shape=[],n=12;for(let i=0;i<n;i++)shape.push([i/n*Math.PI*2,.82+Math.random()*.2]);
  const gems=Array.from({length:6},()=>[Math.random()*6.28,.35+Math.random()*.4,6+Math.random()*7]);
  const cracks=Array.from({length:10},()=>{let a=Math.random()*6.28,x=Math.cos(a)*.15,y=Math.sin(a)*.15;const c=[[x,y]];
    for(let i=0;i<4;i++){a+=(Math.random()-.5)*1.2;x+=Math.cos(a)*.17;y+=Math.sin(a)*.14;c.push([x,y]);}return c;});
  const max=40+Math.min(40,S.st.bosses*3);
  boss={hp:max,max,end:Date.now()+20e3,shape,gems,cracks};Sound.crack();toast("⛏ Разбей глыбу за 20 секунд!");renderChips();
}
function bossWin(){
  const rw=Math.max(500,rate()*240+baseTap()*120);boss=null;S.st.bosses++;S.bossAt=Date.now()+BOSS_EVERY;
  Sound.crack();burstAtCrystal(60);setTimeout(()=>Sound.reward(),300);
  msg("<h2>Глыба разбита!</h2><p>Внутри нашлись кристаллы:</p><div class='big'>💎 "+fmt(rw)+"</div>"+
    "<button class='btn y' id='mAd'>▶ Забрать ×2 за рекламу</button><button class='btn gr' id='mOk'>Забрать</button>",
    {mAd:async()=>{if(await Ads.rewarded()){earn(rw*2);closeMsg();Sound.reward();toast("×2! +"+fmt(rw*2));}else toast("Реклама сейчас недоступна");},
     mOk:()=>{earn(rw);closeMsg();}});
  save();
}
function bossFail(){
  const rw=Math.max(50,rate()*20);boss=null;S.bossAt=Date.now()+BOSS_EVERY*.5;earn(rw);
  msg("<h2>Глыба устояла</h2><p>Ты отколол немного кристаллов:</p><div class='big'>💎 "+fmt(rw)+"</div><p>Новая глыба появится скоро. Прокачай силу клика!</p>"+
    "<button class='btn g' id='mOk'>Хорошо</button>",{mOk:closeMsg});save();
}

/* ================= Интерфейс ================= */
let tab="gen",mult=1;
const MULTS=[1,10,100,"MAX"];
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{Sound.unlock();tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));$("list").scrollTop=0;render(true);});
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2200);}
function msg(html,handlers){$("toast").style.opacity=0;$("msgCard").innerHTML=html;$("ovMsg").classList.add("on");for(const k in handlers){const b=$(k);if(b)b.onclick=handlers[k];}}
function closeMsg(){$("ovMsg").classList.remove("on");}
const buyCount=i=>mult==="MAX"?Math.max(1,maxAfford(i)):mult;
const gem="💎";

let lastKey="",rows=[];
function render(force){
  const L=$("list");let html="",struct=tab+"|"+mult+"|"+S.world;rows=[];
  if(tab==="gen"){
    html+="<div class='lh'><span>Мир: "+WORLDS[S.world].name+" · ×"+fmt(WORLD_MULT(S.world))+"</span><button id='mult'>"+(mult==="MAX"?"MAX":"×"+mult)+"</button></div>";
    const tc=tapCost();rows.push({ic:"👆",n:"Сила клика",lv:S.tapLv,d:"+"+fmt(baseTap())+" за клик",cost:tc,can:S.coins>=tc,act:"tap"});
    let lockShown=false;
    GENS.forEach((g,i)=>{const un=i===0||S.gens[i-1]>0||S.gens[i]>0;
      if(!un){if(lockShown)return;lockShown=true;rows.push({ic:g.ic,n:"???",d:"Купи «"+GENS[i-1].n+"», чтобы открыть",lock:true});return;}
      const n=buyCount(i),c=genCost(i,n),next=[10,25,50,100,200,300,400].find(x=>x>S.gens[i])||S.gens[i]+1;
      rows.push({ic:g.ic,n:g.n,lv:S.gens[i],d:"+"+fmt(GENS[i].inc*genMult(i)*globalMult())+"/с за шт · всего "+fmt(genRate(i)*globalMult())+"/с",
        cost:c,cnt:n,can:S.coins>=c,act:"g"+i,prog:S.gens[i]/next});});
  }else if(tab==="upg"){
    const avail=UPGS.filter(u=>!S.upgs[u.id]&&(u.gen==null||S.gens[u.gen]>=u.need)).slice(0,14);
    const next=UPGS.find(u=>!S.upgs[u.id]&&u.gen!=null&&S.gens[u.gen]<u.need);
    rows=avail.map(u=>({ic:u.ic,n:u.n,d:u.d,cost:upgCost(u),can:S.coins>=upgCost(u),act:"u"+u.id}));
    if(next)rows.push({ic:next.ic,n:"Скоро",d:"Нужно "+next.need+" × «"+GENS[next.gen].n+"»",lock:true});
    if(!rows.length)rows.push({ic:"🏆",n:"Все улучшения куплены!",d:"Ты настоящий магнат",lock:true});
  }else if(tab==="q"){
    ensureQuests();
    html+="<div class='lh'><span>Награда растёт с каждым заданием</span><span>Выполнено: "+S.qLevel+"</span></div>";
    S.quests.forEach((q,i)=>{const d=QT.find(x=>x.t===q.t),p=qProg(q);
      rows.push({ic:d.ic,n:d.txt(q.need),d:"Награда: "+gem+" "+fmt(qReward()),prog:p/q.need,progTxt:p+" / "+q.need,
        cost:0,can:qDone(q),act:"q"+i,claim:true,done:qDone(q)});});
  }else{
    let h="";
    WORLDS.forEach((w,i)=>{const cur=i===S.world,open=i<=S.maxWorld,nextW=i===S.world+1;
      h+="<div class='world "+(cur?"cur":"")+(i>S.world+1&&!open?" lockw":"")+"' style='background:linear-gradient(120deg,"+w.bg[0]+","+w.bg[1]+")'>"+
        "<span class='wi'>"+w.ic+"</span><div style='flex:1'><b>"+w.name+"</b><span>Доход ×"+fmt(WORLD_MULT(i))+"</span></div>"+
        (cur?"<span style='font-weight:900;color:var(--gold)'>Ты здесь</span>":
         nextW?"<button class='buy "+(S.coins>=WORLD_COST[i]?"":"no")+"' data-a='w"+i+"'>Переехать<small>"+gem+" "+fmt(WORLD_COST[i])+"</small></button>":
         i<S.world?"<span style='opacity:.7'>✓</span>":"<span style='opacity:.6'>🔒</span>")+"</div>";});
    h+="<p style='color:var(--mut);font-size:12.5px;margin:10px 4px'>Переезд сбрасывает кристаллы, работников и улучшения, но в новом мире всё приносит гораздо больше.</p>";
    const sh=shardsFor(),gain=Math.max(0,sh-S.shards);
    h+="<div class='it' style='flex-direction:column;align-items:stretch;text-align:center;padding:14px'><div style='font-size:34px'>✨</div>"+
      "<b style='font-size:17px'>Звёздные осколки: "+S.shards+" (+"+S.shards*10+"% ко всему)</b>"+
      "<span style='color:var(--mut);margin:6px 0'>Перерождение вернёт тебя в первый мир, но осколки останутся навсегда.</span>"+
      "<b style='color:var(--gold);font-size:17px'>Получишь: +"+gain+" ✨</b>"+
      "<button class='btn p' id='bPre' "+(gain>0?"":"disabled style='opacity:.5'")+">Переродиться</button></div>";
    html=h;struct+="|"+S.maxWorld+"|"+(S.coins>=(WORLD_COST[S.world+1]||Infinity))+"|"+gain;
  }
  html+=rows.map(rowHtml).join("");
  struct+="|"+rows.map(r=>r.n+r.lv+r.lock+r.progTxt+r.done+(r.prog!=null?Math.round(r.prog*50):"")+(r.act==="tap"||r.act&&r.act[0]==="g"?Math.round(Math.log10(r.cost+1)*10):"")).join(",");
  if(force||struct!==lastKey){L.innerHTML=html;lastKey=struct;
    L.querySelectorAll(".buy").forEach(b=>b.onclick=()=>doBuy(b.dataset.a));
    const m=$("mult");if(m)m.onclick=()=>{mult=MULTS[(MULTS.indexOf(mult)+1)%MULTS.length];Sound.buy();render(true);};
    const bp=$("bPre");if(bp)bp.onclick=prestige;}
  else{const btns=L.querySelectorAll(".buy[data-a]");btns.forEach(b=>{const r=rows.find(x=>x.act===b.dataset.a);if(r&&!r.claim)b.classList.toggle("no",!r.can);});}
  // точки на вкладках
  $("dQ").classList.toggle("on",S.quests.some(qDone));
  $("dW").classList.toggle("on",S.coins>=(WORLD_COST[S.world+1]||Infinity)||shardsFor()>S.shards);
  $("dUpg").classList.toggle("on",UPGS.some(u=>!S.upgs[u.id]&&(u.gen==null||S.gens[u.gen]>=u.need)&&S.coins>=upgCost(u)));
}
function rowHtml(r){
  if(r.lock) return "<div class='it lock'><div class='ic'>"+r.ic+"</div><div class='in'><b>"+r.n+"</b><span>"+r.d+"</span></div></div>";
  const btn=r.claim?"<button class='buy "+(r.done?"claim":"no")+"' data-a='"+r.act+"'>"+(r.done?"Забрать":r.progTxt)+"</button>":
    "<button class='buy "+(r.can?"":"no")+"' data-a='"+r.act+"'>"+(r.cnt>1?"×"+r.cnt+"<br>":"")+gem+" "+fmt(r.cost)+"</button>";
  return "<div class='it "+(r.done?"done":"")+"'><div class='ic'>"+r.ic+"</div><div class='in'><b>"+r.n+(r.lv!=null?"<span class='lv'>"+r.lv+"</span>":"")+"</b><span>"+r.d+"</span>"+
    (r.prog!=null?"<div class='pg'><i style='width:"+Math.min(100,r.prog*100)+"%'></i></div>":"")+"</div>"+btn+"</div>";
}
function doBuy(a){
  Sound.unlock();
  if(a==="tap"){const c=tapCost();if(S.coins<c)return Sound.no();S.coins-=c;S.tapLv++;}
  else if(a[0]==="g"){const i=+a.slice(1),n=buyCount(i),c=genCost(i,n);if(S.coins<c)return Sound.no();S.coins-=c;S.gens[i]+=n;S.st.bought+=n;
    if([10,25,50,100].some(x=>S.gens[i]>=x&&S.gens[i]-n<x)) toast("Открыто улучшение для «"+GENS[i].n+"»!");}
  else if(a[0]==="u"){const u=UPGS.find(x=>x.id===a.slice(1));if(!u||S.upgs[u.id]||S.coins<upgCost(u))return Sound.no();S.coins-=upgCost(u);S.upgs[u.id]=1;S.st.upg++;}
  else if(a[0]==="q"){claimQuest(+a.slice(1));return;}
  else if(a[0]==="w"){moveWorld(+a.slice(1));return;}
  Sound.buy();render(true);updateTop();save();
}
async function moveWorld(i){
  if(i!==S.world+1||S.coins<WORLD_COST[i]){Sound.no();return;}
  const keep={shards:S.shards,lifetime:S.lifetime,daily:S.daily,start:S.start,st:S.st,quests:S.quests,qLevel:S.qLevel,total:S.total,bossAt:S.bossAt,boostUntil:S.boostUntil};
  S=Object.assign(fresh(),keep,{world:i,maxWorld:Math.max(S.maxWorld,i)});
  miners.length=0;carts.length=0;P.length=0;rocks=null;applyWorld();Sound.world();burstAtCrystal(70);save();render(true);updateTop();
  msg("<h2>"+WORLDS[i].ic+" "+WORLDS[i].name+"</h2><p>Добро пожаловать в новый мир! Всё здесь приносит в "+fmt(WORLD_MULT(i))+" раз больше.</p>"+
    "<button class='btn g' id='mOk'>Копать!</button>",{mOk:closeMsg});
  await Ads.interstitial();
}
async function prestige(){
  const gain=shardsFor()-S.shards;if(gain<=0)return;
  const bp=$("bPre");
  if(bp&&!bp.dataset.sure){bp.dataset.sure=1;bp.textContent="Точно? Нажми ещё раз";setTimeout(()=>{if(bp.isConnected){delete bp.dataset.sure;bp.textContent="Переродиться";}},3000);return;}
  const keep={shards:S.shards+gain,lifetime:S.lifetime,daily:S.daily,start:S.start,st:S.st,quests:S.quests,qLevel:S.qLevel,maxWorld:S.maxWorld};
  S=Object.assign(fresh(),keep);miners.length=0;carts.length=0;P.length=0;rocks=null;applyWorld();Sound.world();save();render(true);updateTop();
  toast("Перерождение! Бонус теперь +"+S.shards*10+"%");
  await Ads.interstitial();
}
function applyWorld(){const w=WORLDS[S.world];document.documentElement.style.setProperty("--acc",w.acc);
  document.querySelector("meta[name=theme-color]").content=w.bg[1];$("loc").textContent=w.ic+" "+w.name;}

let chipsKey="";
function renderChips(){
  let h="";
  if(boss)h+="";
  else if(boostActive())h+="<button class='chip act'>🔥 ×2 ещё "+fmtTime((S.boostUntil-Date.now())/1000)+"</button>";
  else h+="<button class='chip ad' data-c='boost'>▶ ×2 добыча на 4 мин</button>";
  if(bossReady())h+="<button class='chip boss' data-c='boss'>🪨 Глыба!</button>";
  if(S.quests.some(qDone)&&tab!=="q")h+="<button class='chip q' data-c='q'>📜 Награда</button>";
  if(S.coins>=(WORLD_COST[S.world+1]||Infinity)&&tab!=="w")h+="<button class='chip w' data-c='w'>🌍 Новый мир!</button>";
  if(h!==chipsKey){chipsKey=h;$("chips").innerHTML=h;
    $("chips").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const c=b.dataset.c;Sound.unlock();
      if(c==="boost")boost();else if(c==="boss")startBoss();else document.querySelector('[data-t="'+c+'"]').click();});}
}
function updateTop(){
  $("coinsV").textContent=fmt(S.coins);$("rate").textContent=fmt(rate())+" / сек"+(boostActive()?"  🔥×2":"");
  renderChips();
}
async function boost(){if(await Ads.rewarded()){S.boostUntil=Math.max(Date.now(),S.boostUntil)+240e3;Sound.reward();toast("Добыча ×2 на 4 минуты!");save();updateTop();render(true);}
  else toast("Реклама сейчас недоступна");}

/* ================= Золотой кристалл ================= */
let goldVal=0;
function openGold(){gold=null;scheduleGold();S.st.golds++;goldVal=Math.max(50,rate()*30,baseTap()*20);
  Sound.gold();msg("<h2>Золотой кристалл!</h2><p>Редкая находка:</p><div class='big'>💎 "+fmt(goldVal)+"</div>"+
    "<button class='btn y' id='mAd'>▶ Получить ×5 за рекламу</button><button class='btn gr' id='mOk'>Забрать</button>",
    {mAd:async()=>{if(await Ads.rewarded()){earn(goldVal*5);closeMsg();Sound.reward();toast("×5! +"+fmt(goldVal*5));}else toast("Реклама сейчас недоступна");},
     mOk:()=>{earn(goldVal);closeMsg();Sound.reward();}});}

/* ================= Оффлайн-доход ================= */
let offVal=0;
function checkOffline(){
  const sec=Math.min(8*3600,(Date.now()-S.last)/1000);S.last=Date.now();
  const r=rate()/(boostActive()?2:1);
  if(sec>60&&r>0){offVal=r*sec*.5;$("offAmt").innerHTML="💎 "+fmt(offVal)+"<div style='font-size:14px;color:#b9d3ec'>за "+fmtTime(sec)+"</div>";$("ovOff").classList.add("on");}
}
$("bOff").onclick=()=>{earn(offVal);offVal=0;$("ovOff").classList.remove("on");Sound.unlock();Sound.reward();save();showDaily();};
$("bOffAd").onclick=async()=>{Sound.unlock();if(await Ads.rewarded()){earn(offVal*3);offVal=0;$("ovOff").classList.remove("on");Sound.reward();save();showDaily();}else toast("Реклама сейчас недоступна");};

/* ================= Ежедневная награда ================= */
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60e3)/864e5);
function dailyReward(st){return Math.max(100*st,rate()*60*(2+st*2));}
function showDaily(){
  if(S.daily.day===today()||$("ovOff").classList.contains("on")) return;
  const st=(S.daily.day===today()-1?S.daily.streak%7:0)+1;
  $("days").innerHTML=[1,2,3,4,5,6,7].map(d=>"<div class='"+(d<st?"d":d===st?"t":"")+"'>День<br><b>"+d+"</b></div>").join("");
  $("dailyAmt").textContent="💎 "+fmt(dailyReward(st));
  $("bDaily").onclick=()=>{earn(dailyReward(st));S.daily={day:today(),streak:st};save();$("ovDaily").classList.remove("on");Sound.unlock();Sound.reward();};
  $("ovDaily").classList.add("on");
}

/* ================= Настройки ================= */
function syncToggles(){document.querySelectorAll(".tg").forEach(el=>el.querySelector(".sw").classList.toggle("on",!!settings[el.dataset.k]));}
document.querySelectorAll(".tg").forEach(el=>el.onclick=()=>{const k=el.dataset.k;settings[k]=!settings[k];Store.set("settings",settings);syncToggles();if(k==="music")Sound.setMusic(settings.music);});
$("bSet").onclick=()=>{Sound.unlock();syncToggles();$("stats").textContent="Всего добыто: "+fmt(S.lifetime)+" · Кликов: "+S.st.taps+" · Глыб: "+S.st.bosses;$("ovSet").classList.add("on");};
$("bSetOk").onclick=()=>$("ovSet").classList.remove("on");

/* ================= Цикл ================= */
let lastT=performance.now(),uiAcc=0;
function loop(t){
  const dt=Math.min(1,(t-lastT)/1000);lastT=t;
  earn(rate()*dt);
  if(fever>0){fever-=dt;if(fever<=0){fever=0;}}else feverMeter=Math.max(0,feverMeter-dt*.04);
  if(boss&&Date.now()>boss.end&&!document.querySelector(".ov.on"))bossFail();
  uiAcc+=dt;if(uiAcc>.25){uiAcc=0;updateTop();render(false);}
  draw(t);requestAnimationFrame(loop);
}
if(!S.bossAt)S.bossAt=Date.now()+60e3;
ensureQuests();resize();applyWorld();Ads.init();checkOffline();showDaily();render(true);updateTop();requestAnimationFrame(loop);
window.__appPause=function(){Sound.suspend();try{save()}catch(e){}};window.__appResume=function(){Sound.resume()};
window.__game={checkOffline,get S(){return S},set S(v){S=v},rate,tapValue,doBuy,tapAt,render,save,startBoss,moveWorld,
  center:()=>({cx,cy,R}),get boss(){return boss},get fever(){return fever},applyWorld,openGold,
  resetScene(){miners.length=0;carts.length=0;P.length=0;rocks=null;applyWorld();}};
</script>
</body>
</html>
