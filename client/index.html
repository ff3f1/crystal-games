function photosView(){return top('Фотодневник','Один кадр в месяц, чтобы увидеть свой путь за год.')+card('Лента изменений',`<div class="between"><div><div class="eyebrow">${photos.length} ФОТО В ЭТОЙ УСТАНОВКЕ</div><div class="tiny">${notifyPhoto()?'Можно добавить новый кадр 📷':'Следующий кадр — примерно через месяц'}</div></div>${btn('＋ Фото','addphoto')}</div><p class="privacy">🔒 Фото остаются в хранилище этого приложения на устройстве. Никуда не отправляются. Системный выбор фото не даёт приложению доступ ко всей галерее.</p>${photos.length?`<div class="photo-grid">${photos.slice().reverse().map(p=>`<div class="photo"><img src="${p.data}" alt="Фото от ${esc(p.date)}"><div class="photofoot"><span>${esc(p.date)}</span><button class="btn pink" style="padding:6px 9px" data-act="delphoto" data-id="${p.id}">×</button></div></div>`).join('')}</div>`:'<div class="empty">Пока нет фотографий. Добавь первую и сохрани момент старта. Через месяц приложение предложит повторить.</div>'}`)+(photos.length>=2?card('Сравнение фотографий',`<div class="compare"><img src="${photos[0].data}" alt="Первый снимок"><div class="compare-after" style="width:50%"><img src="${photos[photos.length-1].data}" alt="Последний снимок"></div><input type="range" min="0" max="100" value="50" aria-label="Сравнение фото" oninput="this.previousElementSibling.style.width=this.value+'%'"></div><p class="tiny">Слева первый снимок, справа последний. Сравнение без оценки тела.</p>`):'')+card('Мой год',`<div class="stats"><div class="stat"><strong>${photos.length}</strong><small>снимков</small></div><div class="stat"><strong>12</strong><small>месяцев</small></div><div class="stat"><strong>🔒</strong><small>локально</small></div></div><p class="tiny">Годовая галерея формируется из добавленных фотографий. Автоматическое сравнение тела и обработка снимков не используются.</p>`)}
function settings(){return top('Настройки','Управляй данными, обучением и будущими подключениями.')+card('Оформление',`<div class="tiny">Переключай тему без потери прогресса.</div><div class="theme-pick"><button class="btn ${state.theme==='dark'?'':'alt'}" data-act="theme" data-value="dark">🌙 Тёмная</button><button class="btn ${state.theme==='light'?'':'alt'}" data-act="theme" data-value="light">☀️ Светлая</button></div>`)+card('Обучение',`<div class="tiny">Запустить вводные экраны снова, если давно не заходил или хочешь показать другу.</div><div style="margin-top:12px">${btn('▶ Пройти обучение заново','tutorial','wide alt')}</div>`)+card('Режим работы',`<div class="item"><span class="emoji">📴</span><div style="flex:1"><div class="tt">Офлайн — работает</div><div class="mm">Данные только на этом устройстве</div></div><span class="mini-badge">АКТИВНО</span></div><div class="item"><span class="emoji">🌐</span><div style="flex:1"><div class="tt">Онлайн, друзья, интересы</div><div class="mm">Потребуется сервер и система аккаунтов</div></div><span class="pill warn">НЕТ СЕРВЕРА</span></div><div class="item"><span class="emoji">⌚</span><div style="flex:1"><div class="tt">Браслеты и часы</div><div class="mm">Планируется интеграция через Health Connect и разрешения пользователя</div></div><span class="pill warn">ПОЗЖЕ</span></div>`)+card('Поделиться прогрессом',`<p class="tiny">Отправь другу карточку с уровнем и достижениями через системное меню Android. Это не онлайн-синхронизация.</p><button class="btn wide alt" data-act="share">↗ Поделиться достижениями</button>`)+card('Твой прогресс',`<div class="btnrow"><button class="btn alt" data-act="go" data-page="insights">📊 Аналитика</button><button class="btn alt" data-act="go" data-page="journey">🗺 Мир RPG</button></div><div style="margin-top:10px"><button class="btn alt wide" data-act="weight">⚖️ Записать вес</button></div>`)+card('Сохранение',`<div class="btnrow">${btn('Экспорт JSON','export','alt')}${btn('Импорт JSON','import','alt')}</div><p class="tiny">Резервная копия JSON включает привычки, деньги и профиль, но НЕ включает фотографии из фотодневника.</p>`)+card('Демо и сброс',`<div class="btnrow">${btn('Показать пример','demo','alt')}${btn('Очистить данные','reset','pink')}</div><p class="tiny">Это тестовая версия. Не вводи сюда конфиденциальные банковские данные.</p>`)+`<div class="footer">ТЫ.УРОВЕНЬ · Концепт v0.6 · Локальный прототип<br>Соревнования и проверки достоверности действий пока отсутствуют.</div>`}
const views={home,quests,money,hero,photos:photosView,settings,insights,journey};const navs=[['home','🏠','Главная'],['quests','⚔️','Квесты'],['money','💳','Деньги'],['hero','🧍','Герой'],['photos','📸','Фото']];function render(){document.body.classList.toggle('light',state.theme==='light');if(!views[page])page="home";$("content").innerHTML=views[page]();$("nav").innerHTML=navs.map(([id,emoji,n])=>`<button class="tab ${id===page?"active":""}" data-act="go" data-page="${id}">${ico(id,23)}${n}</button>`).join("");$("coins").textContent=`◉ ${fmt(balance())} ₽`;if(page==="settings")$("nav").innerHTML+=`<button class="tab active" data-act="go" data-page="settings">${ico("settings",23)}Опции</button>`}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}function go(p){page=p;render();window.scrollTo(0,0)}function popup(title,form){$('sheet').innerHTML=`<div class="modal-top"><strong class="eyebrow">ТЫ.УРОВЕНЬ</strong><button class="x" data-act="close" aria-label="Закрыть">×</button></div><h2>${title}</h2>${form}`;$('overlay').classList.remove('hide')}function close(){$('overlay').classList.add('hide')};const field=(label,key,value='',type='text',extra='')=>`<div class="field"><label for="f-${key}">${label}</label><input id="f-${key}" name="${key}" type="${type}" value="${esc(value)}" ${extra}></div>`;const select=(label,key,options,current)=>`<div class="field"><label for="f-${key}">${label}</label><select id="f-${key}" name="${key}">${options.map(([v,n])=>`<option value="${v}" ${current===v?'selected':''}>${n}</option>`).join('')}</select></div>`;function palette(key,colors){return `<div class="editor-label">${{tone:'Оттенок кожи',hair:'Волосы',coat:'Одежда'}[key]}</div><div class="palette">${colors.map(c=>`<button type="button" style="background:${c}" aria-label="Выбрать цвет ${c}" class="${state.profile[key]===c?'selected':''}" data-act="palette" data-key="${key}" data-color="${c}"></button>`).join('')}</div>`}
function profileForm(){const p=state.profile;return `<form id="profileForm"><div class="editor-preview">${portrait()}</div>${select('Готовый образ персонажа','avatarIndex',[['-1','Свой образ (цвета и телосложение)'],...Array.from({length:8},(_,i)=>[String(i),'Образ '+(i+1)])],String(p.avatarIndex??-1))}<div class="avatar-gallery">${Array.from({length:8},(_,i)=>`<label><input type="radio" name="avatar-preview" data-avatar="${i}" ${p.avatarIndex===i?'checked':''}><img src="assets/avatar-${i}.webp" alt="Образ ${i+1}"></label>`).join('')}</div>${field('Как зовут героя','name',p.name,'text','maxlength="24" required')}${select('Пол персонажа (необязательно)','gender',[['none','Не указывать'],['male','Мужской'],['female','Женский']],p.gender)}<div class="cols">${field('Рост, см (необязательно)','height',p.height,'number','min="90" max="240"')}${field('Вес, кг (необязательно)','weight',p.weight,'number','min="20" max="400" step="0.1"')}</div>${select('Телосложение персонажа','body',[['regular','Обычное'],['slim','Стройное'],['broad','Крепкое']],p.body)}<div class="cols">${field('Цвет кожи','tone',p.tone,'color')}${field('Цвет волос','hair',p.hair,'color')}</div>${field('Цвет одежды','coat',p.coat,'color')}${palette('tone',['#F2C9A6','#E7AD87','#C88A62','#A66A49','#704632','#432B25'])}${palette('hair',['#1D1B20','#342C34','#705038','#AD7954','#D9BD86','#A04B42'])}${palette('coat',['#8BE0BA','#6EACF5','#D2A0E8','#F1B779','#8290A8','#E67F88'])}<button type="submit" class="btn wide">Сохранить персонажа</button><p class="tiny">Внешность меняешь сам. Уровень и аксессуары появляются от выполненных заданий.</p></form>`}
function onboard(){const name=state.profile.name;const dots=`<div class="onb-dots">${[0,1,2].map(i=>`<div class="dot ${onb===i?'on':''}"></div>`).join('')}</div>`;let body='';if(onb===0)body=`<div class="onb-icon">🧬</div><h2>Главный герой — ты</h2><p>Это RPG, где каждый уровень рождается из твоих настоящих действий. Привычки, дела, финансы и достижения — в одном красивом мире.</p><p>Задания в приложении выполняются в реальности — и превращаются в XP.</p>${btn('Понятно, дальше →','next','wide')}`;if(onb===1)body=`<div class="onb-icon">🧍</div><h2>Создай себя</h2><p>Задай внешний вид персонажа. Личные параметры можно пропустить и добавить позже.</p><form id="onbProfile">${field('Как тебя зовут?','name',name==='Герой'?'':name,'text','placeholder="Например, Захар" maxlength="24"')}${select('Образ персонажа','gender',[['none','Нейтральный'],['male','Мужской'],['female','Женский']],state.profile.gender)}<div class="cols">${field('Рост, см · необязательно','height',state.profile.height,'number','min="90" max="240"')}${field('Вес, кг · необязательно','weight',state.profile.weight,'number','min="20" max="400" step="0.1"')}</div><button class="btn wide" type="submit">Создать героя →</button></form>`;if(onb===2)body=`<div class="onb-icon">🗺️</div><h2>Прокачка без гринда</h2><p>Отмечай привычки, записывай деньги, проходи квесты и делай фото раз в месяц. Открывай новые зоны и предметы.</p><div class="pills"><span class="pill">🏃 +25 XP за движение</span><span class="pill">📚 +20 XP за обучение</span><span class="pill">🧥 образы за монеты</span></div><p class="privacy">🔒 Сейчас всё работает офлайн. Фото и записи остаются на устройстве. Игровая статистика не считается медицинскими данными.</p>${btn('Начать мою историю ✦','finish','wide')}`;$('sheet').innerHTML=dots+body;$('overlay').classList.remove('hide')}
function tutorial(){onb=0;onboard()}function addxp(n){try{const a=new Audio('assets/complete.wav');a.volume=.23;a.play().catch(()=>{})}catch{}state.xp+=n;state.coins+=Math.ceil(n/5);save();toast(`+${n} XP · +${Math.ceil(n/5)} монет ✦`)}function habit(id){const h=habits.find(x=>x.id===id);if(!h)return;const ls=state.logs[date()]||[];if(ls.includes(id)){state.logs[date()]=ls.filter(x=>x!==id);toast('Отметка снята. Полученный опыт сохраняется.')}else{state.logs[date()]=[...ls,id];if(!state._rewarded)state._rewarded={};if(!state._rewarded[date()+id]){state._rewarded[date()+id]=true;addxp(h.xp)}else toast('Дело отмечено ✓')}save();render()}
function showEntry(kind){if(kind==='profile')popup('Твой персонаж',profileForm());else if(kind==='addtask')popup('Новый квест',`<form id="taskForm">${field('Что нужно сделать?','name','','text','required maxlength="85" placeholder="Например, 30 минут прогулки"')}${field('Когда?','due',date(),'date','required')}<button type="submit" class="btn wide">Добавить квест</button></form>`);else if(['income','expense'].includes(kind))popup(kind==='income'?'Новый доход':'Новый расход',`<form id="txForm" data-kind="${kind}">${field('Сумма, ₽','amount','','number','required min="1" max="1000000000"')}${select('Категория','category',(kind==='income'?['Работа','Подарок','Другое']:['Еда','Дом','Транспорт','Подписки','Здоровье','Другое']).map(x=>[x,x]),'')}${field('Описание','note','','text','maxlength="90" placeholder="Необязательно"')}${field('Дата','date',date(),'date','required')}<button class="btn wide" type="submit">Сохранить</button></form>`);else if(kind==='budget')popup('Лимит месяца',`<form id="budgetForm">${field('Расходы на месяц, ₽','budget',state.budget,'number','min="0" required')}<button class="btn wide" type="submit">Сохранить</button></form>`)}
function fdata(form){return Object.fromEntries(new FormData(form).entries())};function handleSubmit(e){e.preventDefault();const id=e.target.id,d=fdata(e.target),p=state.profile;switch(id){case 'onbProfile':p.name=(d.name.trim()||'Герой').slice(0,24);p.gender=d.gender;p.height=clamp(Number(d.height)||0,0,240)||'';p.weight=clamp(Number(d.weight)||0,0,400)||'';onb=2;save();onboard();return;case 'profileForm':p.name=(d.name.trim()||'Герой').slice(0,24);p.gender=d.gender;p.body=d.body;p._custom=true;p.avatarIndex=Number(d.avatarIndex);p.height=d.height?clamp(+d.height,90,240):'';p.weight=d.weight?clamp(+d.weight,20,400):'';for(const k of ['tone','hair','coat'])if(/^#[0-9a-fA-F]{6}$/.test(d[k]))p[k]=d[k];break;case 'taskForm':if(!d.name.trim())return;state.tasks.push({id:uid(),name:d.name.trim().slice(0,85),due:d.due,done:false});break;case 'txForm':if(!(Number(d.amount)>0&&Number(d.amount)<=1e9))return toast('Проверь сумму');state.tx.push({id:uid(),kind:e.target.dataset.kind,amount:Math.round(+d.amount),note:d.note.slice(0,90),category:d.category,date:d.date});break;case 'budgetForm':state.budget=clamp(Number(d.budget)||0,0,1e9);break;case 'customHabitForm':{const h={id:'custom_'+uid(),emoji:'✨',name:d.name.trim().slice(0,65),skill:d.skill,xp:Math.min(25,Math.max(5,Number(d.xp)||15))};if(!h.name)return;state.customHabits.push(h);habits.push(h);break}case 'billForm':{const b={id:uid(),name:d.name.trim().slice(0,60),amount:Math.round(Number(d.amount)),day:clamp(Number(d.day),1,28),category:d.category,paid:[]};if(!b.name||!b.amount||b.amount<0||b.amount>1e9)return;state.bills.push(b);break}case 'weightForm':{const w=Number(d.weight);if(!Number.isFinite(w)||w<20||w>400)return;state.healthLog.push({date:date(),weight:w});state.profile.weight=w;break}default:return}save();close();render();toast('Сохранено ✓')}
function doAction(act,el){switch(act){case 'theme':state.theme=el.dataset.value==='light'?'light':'dark';save();render();toast('Тема изменена');break;case 'avatar-preset':{const idx=Number(el.dataset.idx);if(idx>=0&&idx<8){const selectEl=document.querySelector('[name=avatarIndex]');if(selectEl)selectEl.value=String(idx);const preview=document.querySelector('.editor-preview');if(preview)preview.innerHTML=`<img style="height:260px;max-width:100%;object-fit:contain" src="assets/avatar-${idx}.webp">`;}break;}case 'palette':{const key=el.dataset.key,c=el.dataset.color;if(!['tone','hair','coat'].includes(key)||!/^#[0-9A-Fa-f]{6}$/.test(c))break;const input=document.querySelector('#f-'+key);if(input)input.value=c;document.querySelectorAll('[data-act=palette][data-key='+key+']').forEach(x=>x.classList.toggle('selected',x.dataset.color===c));break;}case 'share':{const t=`Я на уровне ${lvl().n} в ТЫ.УРОВЕНЬ! ${fmt(state.xp)} XP, ${doneCount()} дел сегодня. Прокачиваю реальную жизнь ✦`;if(navigator.share)navigator.share({title:'Мой прогресс',text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Текст скопирован'));else toast('Поделиться недоступно');break;}case 'go':go(el.dataset.page);break;case 'quests':go('quests');break;case 'close':close();break;case 'next':onb=1;onboard();break;case 'finish':state.onboard=true;state.tutorial=true;save();close();go('home');toast('Твоя история началась ✦');break;case 'tutorial':onb=0;onboard();break;case 'habit':habit(el.dataset.id);break;case 'task':{const t=state.tasks.find(t=>t.id===el.dataset.id);if(t){t.done=!t.done;if(t.done&&!t.rewarded){t.rewarded=true;addxp(30)}save();render()}}break;case 'skin':{const id=el.dataset.id;const cost={starter:0,forest:45,neon:80}[id];if(cost===undefined)return;if(!state.unlocked.includes(id)){if(state.coins<cost)return toast('Недостаточно монет');state.coins-=cost;state.unlocked.push(id)}state.skin=id;state.profile._custom=true;state.profile.coat=id==='forest'?'#77B878':id==='neon'?'#B69AFD':'#8BE0BA';save();render();toast('Новый образ надет!')}break;case 'profile':case 'addtask':case 'income':case 'expense':case 'budget':showEntry(act);break;case 'customhabit':customHabitForm();break;case 'bill':billForm();break;case 'billpay':payBill(el.dataset.id);break;case 'billdelete':deleteBill(el.dataset.id);break;case 'weight':weightForm();break;case 'addphoto':$('photoPicker').click();break;case 'delphoto':if(confirm('Удалить эту фотографию навсегда?'))delphoto(el.dataset.id);break;case 'export':exportData();break;case 'import':$('importPicker').click();break;case 'demo':if(confirm('Добавить пример финансовых операций и игровые задания?')){state.demo=true;if(!state.tx.some(t=>t.demo)){state.tx.push({id:uid(),kind:'income',amount:85000,note:'Пример: зарплата',category:'Работа',date:date(),demo:true},{id:uid(),kind:'expense',amount:18900,note:'Пример: аренда',category:'Дом',date:date(),demo:true})}if(!state.tasks.some(t=>t.demo))state.tasks.push({id:uid(),name:'Прогуляться 30 минут',due:date(),done:false,demo:true});save();render();toast('Демо-данные добавлены')}break;case 'reset':if(confirm('Удалить ВСЮ статистику и фотографии на этом устройстве? Это нельзя отменить.')){state=defaults();save();clearphotos().then(()=>{render();onb=0;onboard()})}break}}
// Фотографии сохраняются в IndexedDB, без сетевых запросов и широких разрешений.
function openDB(){return new Promise(resolve=>{try{const r=indexedDB.open('ty-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('shots',{keyPath:'id'});r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>resolve()}catch{resolve()}})}
function dbWrite(mode,fn){return new Promise(resolve=>{if(!db)return resolve(false);try{const t=db.transaction('shots',mode);const s=t.objectStore('shots');fn(s);t.oncomplete=()=>resolve(true);t.onerror=()=>resolve(false)}catch{resolve(false)}})}async function readphotos(){if(!db)return;return new Promise(resolve=>{let r=db.transaction('shots','readonly').objectStore('shots').getAll();r.onsuccess=()=>{photos=r.result.sort((a,b)=>a.date.localeCompare(b.date));resolve()};r.onerror=()=>resolve()})}async function delphoto(id){await dbWrite('readwrite',s=>s.delete(id));await readphotos();state.photosCount=photos.length;state.photoDate=photos.length?photos[photos.length-1].date:'';save();render();toast('Фото удалено')}
async function clearphotos(){await dbWrite('readwrite',s=>s.clear());photos=[]}async function handlePhoto(file){if(!file)return;if(!file.type.startsWith('image/')||file.size>20*1024*1024)return toast('Выбери изображение до 20 МБ');try{const source=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{let im=new Image;im.onload=()=>res(im);im.onerror=rej;im.src=source});const ratio=Math.min(1,980/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.74);const saved=await dbWrite('readwrite',s=>s.put({id:uid(),date:date(),data}));if(!saved)throw new Error('Хранилище недоступно');await readphotos();state.photosCount=photos.length;state.photoDate=date();save();render();toast('Фото сохранено только на устройстве ✓')}catch(e){toast('Не удалось добавить фото: '+e.message)}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});if(window.AndroidBridge?.exportJson){let r=new FileReader;r.onload=()=>window.AndroidBridge.exportJson(String(r.result).split(',')[1]);r.readAsDataURL(blob);toast('Выбери, куда сохранить резервную копию');return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ty-level-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800);toast('Экспорт подготовлен, фото не включены')}
async function importFile(file){if(!file||file.size>2000000)return toast('Файл не подходит');try{let v=JSON.parse(await file.text());if(v?.v!==2||!v.profile||!Array.isArray(v.tx)||!Array.isArray(v.tasks)||!v.logs)throw Error();if(!confirm('Заменить текущий прогресс данными из файла?'))return;state=v;state.theme??='dark';state.bills??=[];state.customHabits??=[];state.healthLog??=[];for(const h of state.customHabits)if(!habits.some(x=>x.id===h.id))habits.push(h);save();render();toast('Данные импортированы')}catch{toast('Неверный формат резервной копии')}}

function billSection(){const bills=state.bills||[];const total=bills.reduce((n,b)=>n+b.amount,0);return `<div class="section">Обязательные платежи</div>`+card('Платежи каждый месяц',`<div class="between"><span class="tiny">Запланировано: <b>${fmt(total)} ₽ / месяц</b></span><button class="btn alt" data-act="bill">＋ Добавить</button></div>${bills.length?bills.map(b=>{let paid=b.paid?.includes(month());return `<div class="item"><span class="emoji">${paid?'✅':'📅'}</span><div style="flex:1"><div class="tt">${esc(b.name)}</div><div class="mm">До ${b.day} числа · ${esc(b.category)} · ${fmt(b.amount)} ₽</div></div><button class="btn ${paid?'alt':''}" data-act="billpay" data-id="${b.id}">${paid?'Оплачено':'Оплатить'}</button><button class="btn alt" aria-label="Удалить" data-act="billdelete" data-id="${b.id}">×</button></div>`}).join(''):'<div class="empty">Добавь аренду, связь или подписки — приложение поможет отслеживать их каждый месяц.</div>'}<p class="tiny">Отметка «Оплатить» добавляет расход только один раз за месяц. Банковской интеграции нет.</p>`)}
function customHabitForm(){popup('Своя привычка',`<form id="customHabitForm"><label>Название<input name="name" required maxlength="65" placeholder="Например, чтение 20 минут"></label><label>Сфера<select name="skill"><option>Здоровье</option><option>Энергия</option><option>Развитие</option><option>Финансы</option></select></label><label>Опыт<select name="xp"><option value="10">10 XP</option><option value="15">15 XP</option><option value="20">20 XP</option></select></label><button class="btn wide" type="submit">Создать привычку</button></form>`)}
function billForm(){popup('Новый ежемесячный платёж',`<form id="billForm"><label>Название<input name="name" maxlength="60" required placeholder="Аренда, интернет, кредит"></label><label>Сумма ₽<input name="amount" type="number" min="1" max="1000000000" required></label><label>Оплатить до числа<input name="day" type="number" min="1" max="28" value="10" required></label><label>Категория<select name="category"><option>Дом</option><option>Связь</option><option>Подписки</option><option>Транспорт</option><option>Другое</option></select></label><button class="btn wide" type="submit">Сохранить платёж</button></form>`)}
function payBill(id){const b=state.bills.find(x=>x.id===id);if(!b)return;if(b.paid?.includes(month()))return toast('Уже оплачено в этом месяце');if(!confirm(`Записать расход ${fmt(b.amount)} ₽ — ${b.name}?`))return;b.paid??=[];b.paid.push(month());state.tx.push({id:uid(),kind:'expense',amount:b.amount,note:b.name,category:b.category,date:date(),billId:id});save();render();toast('Платёж учтён')}
function deleteBill(id){if(!confirm('Удалить плановый платёж? История расходов сохранится.'))return;state.bills=state.bills.filter(x=>x.id!==id);save();render()}
function weightForm(){popup('История веса',`<form id="weightForm"><label>Вес, кг<input name="weight" type="number" min="20" max="400" step="0.1" value="${state.profile.weight||75}" required></label><button class="btn wide" type="submit">Сохранить запись</button></form><p class="tiny">Изменение веса не влияет на ценность человека и не начисляет XP.</p>`)}
function insights(){const days=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(13-i));return d.toLocaleDateString('sv-SE')});const counts=days.map(d=>(state.logs[d]||[]).length);const max=Math.max(1,...counts);const streak=(()=>{let n=0;for(let i=0;i<365;i++){let d=new Date();d.setDate(d.getDate()-i);if((state.logs[d.toLocaleDateString('sv-SE')]||[]).length)n++;else if(i>0)break}return n})();const weight=state.healthLog||[];const categories={};state.tx.filter(t=>t.kind==='expense'&&t.date.startsWith(month())).forEach(t=>categories[t.category]=(categories[t.category]||0)+t.amount);return top('Аналитика','Только твои реальные записи. Без оценок и давления.')+card('Последние 14 дней',`<div class="chartbars">${counts.map((v,i)=>`<div class="chartcol" title="${days[i]}: ${v}"><div style="height:${Math.max(5,v/max*95)}%;background:${v?'#bbfb69':'#334155'}"></div></div>`).join('')}</div><div class="between"><span class="tiny">Отмечено действий: ${counts.reduce((a,b)=>a+b,0)}</span><span class="tiny">Серия: ${streak} дн.</span></div>`)+card('Расходы по категориям',Object.entries(categories).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div style="flex:1">${esc(k)}</div><strong>${fmt(v)} ₽</strong></div>`).join('')||'<div class="empty">Пока нет расходов в этом месяце.</div>')+card('Вес: записи, не оценка',`${weight.length?weight.slice(-12).map(w=>`<div class="item"><span>${esc(w.date)}</span><strong>${w.weight} кг</strong></div>`).join(''):'<div class="empty">Записей пока нет.</div>'}<button class="btn alt wide" data-act="weight">＋ Записать вес</button>`)+card('Достижения',`<div class="achievement-grid">${[[1,'🌱','Первый шаг',state.xp>0],[2,'🔥','Серия',streak>=3],[3,'🏅','Уровень 3',lvl().n>=3],[4,'📖','Планировщик',state.tasks.some(x=>x.done)],[5,'💳','Учёт финансов',state.tx.length>=5],[6,'📷','Хроника',photos.length>=2]].map(([id,icon,title,yes])=>`<div class="achievement ${yes?'':'muted-ach'}"><b>${icon}</b><span>${title}</span></div>`).join('')}</div>`)}
function journey(){const n=lvl().n;return top('Мир твоего пути','Новые места открываются по мере развития привычек.')+`<section class="world-stage"><div class="world-title">КАРТА ТВОЕЙ ИСТОРИИ</div><div class="world-sub">Глава ${n} · ${fmt(state.xp)} XP</div></section>`+card('Путь героя',zones.map(([icon,title,min],i)=>`<div class="journey-node ${n>=min?'':'locked'}"><div class="journey-icon">${icon}</div><div style="flex:1"><strong>${title}</strong><p class="tiny">${n>=min?'Глава открыта':'Достигни уровня '+min}</p></div><span>${n>=min?'✓':'🔒'}</span></div>`).join(''))+`<div style="margin:16px 0"><button class="btn wide" data-act="go" data-page="quests">Выполнять квесты</button></div>`}

window.__receiveImportedJson=raw=>{try{let bytes=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));const file=new File([bytes],'backup.json',{type:'application/json'});importFile(file)}catch{toast('Ошибка импорта')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)doAction(el.dataset.act,el)});document.addEventListener('submit',handleSubmit);$('photoPicker').addEventListener('change',e=>{handlePhoto(e.target.files?.[0]);e.target.value=''});$('importPicker').addEventListener('change',e=>{importFile(e.target.files?.[0]);e.target.value=''});$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')&&state.onboard)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.onboard)close()});openDB().then(()=>readphotos()).then(()=>{render();if(!state.onboard)onboard()});
})();
</script><script src="online.js"></script><script>document.addEventListener('change',e=>{if(e.target.matches('[data-avatar]')){const v=e.target.dataset.avatar;const s=document.querySelector('[name=avatarIndex]');if(s)s.value=v;const p=document.querySelector('.editor-preview');if(p)p.innerHTML='<img style="height:260px;max-width:100%;object-fit:contain" src="assets/avatar-'+v+'.webp">';}});</script></body></html>
