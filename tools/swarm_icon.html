<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1024" height="1024"></canvas>
<script>
// Иконка «Звёздного роя»: спиральный рой светлячков на тёмном фоне
function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r=rnd(7),c=document.getElementById("c"),x=c.getContext("2d"),S=1024,C=S/2;
let g=x.createRadialGradient(C,C*0.9,0,C,C,S*0.75);g.addColorStop(0,"#2a1b5e");g.addColorStop(0.55,"#120a2e");g.addColorStop(1,"#05030f");
x.fillStyle=g;x.fillRect(0,0,S,S);
for(let i=0;i<260;i++){x.fillStyle=`rgba(255,255,255,${0.15+r()*0.5})`;const s=r()<0.1?3:1.5;x.fillRect(r()*S,r()*S,s,s)}
x.globalCompositeOperation="lighter";
// туманность
for(let i=0;i<14;i++){const a=r()*6.28,d=150+r()*260,px=C+Math.cos(a)*d,py=C+Math.sin(a)*d,rad=120+r()*160;
 const gg=x.createRadialGradient(px,py,0,px,py,rad);const h=r()<0.5?"80,200,255":"200,80,255";gg.addColorStop(0,`rgba(${h},0.10)`);gg.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gg;x.beginPath();x.arc(px,py,rad,0,7);x.fill()}
function dot(px,py,rad,col,a){const gg=x.createRadialGradient(px,py,0,px,py,rad);gg.addColorStop(0,`rgba(255,255,240,${a})`);gg.addColorStop(0.25,`rgba(${col},${a*0.8})`);gg.addColorStop(1,`rgba(${col},0)`);x.fillStyle=gg;x.beginPath();x.arc(px,py,rad,0,7);x.fill()}
// спиральные рукава роя
const cols=["255,235,90","180,255,120","90,255,200","120,220,255"];
for(let i=0;i<1700;i++){
  const arm=i%3,t=Math.pow(r(),0.8),ang=arm*2.094+t*4.2+0.6,rr=40+t*360,sp=(10+t*55)*(r()+r()-1);
  const px=C+Math.cos(ang)*rr+Math.cos(ang+1.57)*sp,py=C+Math.sin(ang)*rr+Math.sin(ang+1.57)*sp;
  const col=cols[Math.min(3,Math.floor(t*4))];dot(px,py,6+r()*16*(1-t*0.5),col,0.35+r()*0.4)}
// ядро
dot(C,C,230,"255,220,120",0.55);dot(C,C,120,"255,250,200",0.9);dot(C,C,60,"255,255,255",1);
x.globalCompositeOperation="source-over";
const v=x.createRadialGradient(C,C,S*0.35,C,C,S*0.72);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,0.55)");x.fillStyle=v;x.fillRect(0,0,S,S);
document.title="done";
</script></body></html>
