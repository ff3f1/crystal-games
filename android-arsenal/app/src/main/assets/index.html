const KEY='arsenal.v1';const blank=()=>({version:1,items:[],kits:[],wishes:[],trophies:[],trip:null,settings:{demo:false},feeder:{minutes:6,casts:0,bites:0,end:0,distance:0}});let db=blank();try{const a=JSON.parse(window.ArsenalNative?.loadState()||localStorage.getItem(KEY)||'null');if(a&&a.version===1)db={...blank(),...a,trophies:Array.isArray(a.trophies)?a.trophies:[]}}catch(e){};let tab='home',filter='all',search='',sort='recent',viewMode='active',moreView='stats',toastTimer;

function head(title,btn='',action=''){return `<div class="subhead"><h1>${title}</h1>${btn?`<button class="primary" onclick="${action}">${I('plus')} ${btn}</button>`:''}</div>`}
function empty(title,text,btn,action,icon='box'){return `<div class="empty">${I(icon)}<h3>${title}</h3><p>${text}</p>${btn?`<button class="primary" onclick="${action}">${btn}</button>`:''}</div>`}
function section(title,btn,action,body){return `<section class="section"><div class="sectionhead"><h2>${title}</h2>${btn?`<button onclick="${action}">${btn} ${I('arrow')}</button>`:''}</div>${body}</section>`}
function itemrow(x){return `<button class="item" onclick="detail('${x.id}')"><img class="thumb" src="${photo(x)}" alt=""><div class="grow"><div class="row between"><h3>${esc(x.name)}</h3><span class="cost">${money(x.price*x.qty)}</span></div><div class="desc">${esc(cats[x.cat])} · ${x.qty} шт. ${x.location?'· '+esc(x.location):''}</div><div style="margin-top:7px"><span class="pill ${x.sold?'gray':isDue(x)?'warn':''}">${x.sold?'Продано':isDue(x)?'Обслужить':esc(condition(x))}</span></div></div>${I('arrow')}</button>`}
function home(){let a=active(),due=a.filter(isDue);return `<div class="hero"><img src="${ART["hero"]}" alt=""><div class="eyebrow">ЛИЧНЫЙ АРСЕНАЛ</div><h1>Мой арсенал</h1><div class="value">${money(cash())}</div><div class="muted tiny">Оценка коллекции</div>${a.some(x=>x.demo)?'<div class="demo-label">Включены демо-данные</div><br>':''}<button class="primary" onclick="editItem()">${I('plus')} Добавить снасть</button></div><div class="stats"><div class="metric"><strong>${count(a)}</strong><small>Предметов</small></div><div class="metric"><strong>${db.kits.length}</strong><small>Комплектов</small></div></div><div class="quick-actions"><button onclick="openTrip()"><span class="quick-icon">${I('list')}</span><span><b>На рыбалку</b><small>Чек-лист сборов</small></span>${I('arrow')}</button><button onclick="moreView='feeder';page('more')"><span class="quick-icon">${I('timer')}</span><span><b>Фидер</b><small>Таймер и дистанция</small></span>${I('arrow')}</button></div>${proCard()}${ratingCard()}${trophyHome()}${!a.length?section('Начните с любимой снасти','','',`<div class="card"><p class="muted">Добавьте удилище, катушку или приманку. Фотографии и цены останутся на вашем телефоне.</p><div class="actions"><button class="ghost small" onclick="demo()">Посмотреть демо-коллекцию</button></div></div>`):''}${section('Снасти','Весь арсенал',"page('gear')",`<div class="grid">${cat.map(([k,n],i)=>`<button class="category" onclick="page('gear');filter='${k}';render()"><img src="${art(k)}" alt=""><h3>${n}</h3><div class="count">${count(a.filter(x=>x.cat===k))} шт.</div></button>`).join('')}</div>`)}${a.filter(x=>['line','hook'].includes(x.cat)&&x.qty<=2).length?section('Проверить запас','', '',a.filter(x=>['line','hook'].includes(x.cat)&&x.qty<=2).slice(0,3).map(itemrow).join('')):''}${due.length?section('Пора обслужить','', '',due.map(itemrow).join('')):''}${a.length?section('Недавние снасти','Все',"page('gear')",a.slice().reverse().slice(0,3).map(itemrow).join('')):''}`}

const fld=(label,name,value='',type='text',extra='')=>`<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`, opts=(arr,val)=>arr.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('');let pendingPhoto='';
function editItem(id,pre){let x=db.items.find(i=>i.id===id)||pre||{cat:filter==='all'?'rod':filter,qty:1,date:today(),condition:'Хорошее'};beginGallery(x);dialog(id?'Редактировать снасть':'Новая снасть',`<form id="itemform" onsubmit="submitItem(event,'${id||''}')">${galleryEditor("Фото снасти")}<div class="field"><label for="cat">Категория</label><select id="cat" name="cat" onchange="$('#specFields').innerHTML=specFields(this.value,{})">${cat.map(([k,n])=>`<option value="${k}" ${x.cat===k?'selected':''}>${n}</option>`).join('')}</select></div>${fld('Название / модель *','name',x.name,'text','required maxlength="90" placeholder="Например, Shimano Nasci 2500"')}${fld('Бренд','brand',x.brand,'text','maxlength="60"')}${fld('Ссылка на товар','url',x.url,'url','maxlength="2048" placeholder="https://..."')}<div class="split">${fld('Цена за штуку, ₽','price',x.price,'number','min="0" max="100000000" step="0.01"')}${fld('Количество','qty',x.qty??1,'number','required min="1" max="100000" step="1"')}</div>${fld('Дата покупки','date',x.date||today(),'date')}${fld('Где хранится','location',x.location,'text','maxlength="80" placeholder="Коробка № 2, гараж"')}<div class="field"><label>Состояние</label><select name="condition">${opts(['Новое','Хорошее','Требует ремонта','Изношено'],condition(x))}</select></div><div id="specFields">${specFields(x.cat,x)}</div><div class="split">${fld('Последнее обслуживание','serviceDate',x.serviceDate,'date')}${fld('Интервал, дней (0 = нет)','serviceDays',x.serviceDays||0,'number','min="0" max="3650"')}</div><div class="field"><label>Заметки</label><textarea name="notes" maxlength="2000" placeholder="Особенности, впечатления…">${esc(x.notes)}</textarea></div><div class="modalfoot"><button type="button" class="ghost" onclick="closeModal()">Отмена</button><button class="primary">Сохранить</button></div></form>`)}
function specFields(k,x){return k==='rod'?`<div class="split">${fld('Тест от, г','testMin',x.testMin,'number','min="0" step="0.1"')}${fld('Тест до, г','testMax',x.testMax,'number','min="0" step="0.1"')}</div>${fld('Длина, м','length',x.length,'number','min="0" step="0.01"')}`:k==='lure'||k==='hook'?fld('Вес одной приманки / груза, г','weight',x.weight,'number','min="0" step="0.1"'):k==='reel'?fld('Размер катушки','size',x.size,'text','maxlength="40"'):k==='line'?fld('Диаметр / PE','size',x.size,'text','maxlength="40"'):''}
async function choosePhoto(input){await addGalleryPhotos(input)}
function submitItem(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(!f.name.trim())return toast('Введите название');if(!validProduct(f.url))return toast('Ссылка должна быть http:// или https://');if(!galleryReady())return;if(f.cat==='rod'&&f.testMin!==''&&f.testMax!==''&&num(f.testMax)>0&&num(f.testMin)>num(f.testMax))return toast('Нижняя граница теста больше верхней');let old=db.items.find(i=>i.id===id),x={id:id||uid(),...f,name:f.name.trim(),price:num(f.price),qty:Math.max(1,Math.floor(num(f.qty))),testMin:num(f.testMin),testMax:num(f.testMax),length:num(f.length),weight:num(f.weight),serviceDays:num(f.serviceDays),photos:pendingPhotos.slice(),sold:old?.sold||false,sale:old?.sale||0,saleDate:old?.saleDate||'',demo:old?.demo||false};if(commit(()=>{if(old)db.items[db.items.indexOf(old)]=x;else db.items.push(x)})){closeModal();render();adAction();toast('Снасть сохранена')}}
function detail(id){let x=db.items.find(i=>i.id===id);if(!x)return;dialog(esc(x.name),`${galleryView(x,art(x.cat))}<div class="row between" style="margin:12px 0"><span class="pill">${esc(cats[x.cat])}</span><strong style="color:var(--gold);font-size:24px">${money(x.price*x.qty)}</strong></div>${[['Марка',x.brand],['Количество',x.qty+' шт.'],['Дата покупки',x.date],['Хранение',x.location],['Состояние',condition(x)],['Тест',x.testMax?x.testMin+'–'+x.testMax+' г':''],['Длина',x.length?x.length+' м':''],['Вес',x.weight?x.weight+' г':''],['Размер',x.size],['Обслуживание',x.serviceDate],['Продано',x.sold?money(x.sale):'']].filter(a=>a[1]).map(([k,v])=>`<div class="listline"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join('')}${productButton(x,'item')}${gearTrophyStats(x.id)}${x.notes?`<p class="note" style="margin-top:12px;white-space:pre-wrap">${esc(x.notes)}</p>`:''}<div class="stack" style="margin-top:14px"><button class="primary" onclick="editItem('${id}')">Редактировать</button>${!x.sold?`<div class="split"><button onclick="changeQty('${id}',-1)">− 1 шт.</button><button onclick="changeQty('${id}',1)">+ 1 шт.</button></div><button onclick="service('${id}')">${I('tool')} Отметить обслуживание</button><button class="ghost" onclick="sale('${id}')">Отметить продажу</button>`:`<button onclick="restoreItem('${id}')">Вернуть в арсенал</button>`}<button class="danger ghost" onclick="deleteItem('${id}')">Удалить</button></div>`)}
function changeQty(id,delta){let x=db.items.find(i=>i.id===id);if(x.qty+delta<1)return toast('Минимум 1. Для списания удалите предмет.');if(commit(()=>x.qty+=delta)){render();detail(id)}}
function service(id){let x=db.items.find(i=>i.id===id);if(commit(()=>x.serviceDate=today())){render();detail(id);toast('Обслуживание отмечено')}}
function sale(id){dialog('Продажа снасти',`<form onsubmit="sell(event,'${id}')">${fld('Сумма продажи за всё количество, ₽','sale',0,'number','required min="0" step="0.01"')}${fld('Дата','saleDate',today(),'date','required')}<button class="primary" style="width:100%">Отметить проданной</button></form>`)}function sell(e,id){e.preventDefault();let x=db.items.find(i=>i.id===id),f=Object.fromEntries(new FormData(e.target));if(commit(()=>{x.sold=true;x.sale=num(f.sale);x.saleDate=f.saleDate;db.kits.forEach(k=>k.items=k.items.filter(i=>i!==id))})){closeModal();render();toast('Продажа сохранена')}}
function restoreItem(id){let x=db.items.find(i=>i.id===id);if(commit(()=>{x.sold=false;x.sale=0;x.saleDate=''})){render();detail(id)}}function deleteItem(id){if(!confirm('Удалить снасть из коллекции и комплектов?'))return;if(commit(()=>{db.items=db.items.filter(i=>i.id!==id);db.kits.forEach(k=>k.items=k.items.filter(i=>i!==id))})){closeModal();render()}}
function kitItems(k){return active().filter(x=>k.items.includes(x.id))}function warnings(k){let a=kitItems(k),rods=a.filter(x=>x.cat==='rod'&&x.testMax),weights=a.filter(x=>['lure','hook'].includes(x.cat)&&x.weight);let w=[];if(rods.length===1)for(let l of weights){let r=rods[0];if(l.weight<r.testMin||l.weight>r.testMax)w.push(l.name+': '+l.weight+' г вне теста '+r.testMin+'–'+r.testMax+' г')}return w}
function kits(){return head('Комплекты','Создать','editKit()')+`<p class="muted tiny" style="margin-bottom:15px">Готовые наборы под конкретный способ ловли. Проверка веса — ориентир, а не гарантия совместимости.</p>${db.kits.length?db.kits.map(k=>{let a=kitItems(k),w=warnings(k);return `<div class="card"><img class="kitart" src="${ART["hero"]}" alt=""><div class="eyebrow">${esc(k.type)}</div><h2 style="margin:5px 0">${esc(k.name)}</h2><div class="muted tiny">${a.length} поз. · ${money(worth(a))}</div><div style="margin-top:8px"><span class="pill ${w.length?'warn':'gray'}">${w.length?'Есть замечания':'Проверить комплект'}</span></div><div class="actions"><button class="primary small" onclick="kitDetail('${k.id}')">Открыть</button><button class="ghost small" onclick="newTrip('${k.id}')">На рыбалку</button></div></div>`}).join(''):empty('Соберите первый комплект','Например, ультралайт на окуня или фидер на леща.','Создать комплект','editKit()','layers')}<button class="ghost" style="width:100%" onclick="openTrip()">${I('list')} Чек-лист выезда</button>`}
function editKit(id){let k=db.kits.find(x=>x.id===id)||{name:'',type:'Спиннинг',items:[],notes:''};dialog(id?'Редактировать комплект':'Новый комплект',`<form onsubmit="submitKit(event,'${id||''}')">${fld('Название *','name',k.name,'text','required maxlength="80" placeholder="Ультралайт на окуня"')}<div class="field"><label>Способ ловли</label><select name="type">${opts(['Спиннинг','Фидер','Поплавок','Зимняя ловля','Карпфишинг','Другое'],k.type)}</select></div><h3 style="margin-top:16px">Выберите снасти</h3>${active().length?active().map(x=>`<label class="checkrow"><input type="checkbox" name="items" value="${x.id}" ${k.items.includes(x.id)?'checked':''}><img src="${photo(x)}" style="width:40px;height:40px;object-fit:contain"><span>${esc(x.name)}</span></label>`).join(''):'<p class="note">Сначала добавьте предметы в арсенал. Пустой комплект можно заполнить позже.</p>'}<div class="field"><label>Заметки</label><textarea name="notes" maxlength="1000">${esc(k.notes)}</textarea></div><div class="modalfoot"><button class="ghost" type="button" onclick="closeModal()">Отмена</button><button class="primary">Сохранить</button></div></form>`)}
function submitKit(e,id){e.preventDefault();let f=new FormData(e.target),k={id:id||uid(),name:f.get('name').trim(),type:f.get('type'),items:f.getAll('items'),notes:f.get('notes')};if(!k.name)return toast('Введите название');if(commit(()=>{let i=db.kits.findIndex(x=>x.id===id);if(i<0)db.kits.push(k);else db.kits[i]=k})){closeModal();render();adAction();toast('Комплект сохранён')}}
function kitDetail(id){let k=db.kits.find(x=>x.id===id),a=kitItems(k),w=warnings(k);dialog(esc(k.name),`<p class="muted">${esc(k.type)} · ${a.length} поз. · ${money(worth(a))}</p>${w.length?`<div class="card" style="margin-top:12px"><span class="pill warn">Вес вне теста</span>${w.map(t=>`<p class="tiny" style="margin-top:8px">${esc(t)}</p>`).join('')}</div>`:''}<p class="note" style="margin:12px 0">Проверяется вес отдельной приманки/груза при одном удилище с заполненным тестом. Полный вес монтажа, прочность и совместимость катушки проверяйте самостоятельно.</p>${a.map(itemrow).join('')}${k.notes?`<p class="note">${esc(k.notes)}</p>`:''}<div class="stack" style="margin-top:12px"><button class="primary" onclick="newTrip('${id}')">Собраться на рыбалку</button><button onclick="editKit('${id}')">Редактировать</button><button onclick="shareKit('${id}')">${I('share')} Поделиться списком</button><button class="danger ghost" onclick="deleteKit('${id}')">Удалить комплект</button></div>`)}function deleteKit(id){if(confirm('Удалить комплект? Снасти останутся.')){commit(()=>db.kits=db.kits.filter(k=>k.id!==id));closeModal();render()}}
function newTrip(id){let k=db.kits.find(k=>k.id===id);if(db.trip&&!confirm('Заменить текущий чек-лист?'))return;commit(()=>db.trip={name:k?.name||'Рыбалка',rows:[...(k?kitItems(k).map(i=>i.name):[]),'Документы и разрешения','Подсак','Аптечка','Вода и еда','Пакет для мусора'].map(s=>({id:uid(),name:s,done:false}))});render();openTrip()}
function openTrip(){if(!db.trip){dialog('Чек-лист рыбалки',`<p class="muted" style="margin-bottom:12px">Создайте список из комплекта или начните с базовых вещей.</p>${db.kits.map(k=>`<button style="width:100%;margin-bottom:8px" onclick="newTrip('${k.id}')">${esc(k.name)}</button>`).join('')}<button class="primary" style="width:100%" onclick="newTrip('')">Базовый чек-лист</button>`);return}let t=db.trip,n=t.rows.filter(r=>r.done).length;dialog(esc(t.name),`<div class="row between"><span>${n} из ${t.rows.length} собрано</span><b>${t.rows.length?Math.round(n/t.rows.length*100):0}%</b></div><div class="bar" style="margin:10px 0"><span style="width:${t.rows.length?n/t.rows.length*100:0}%"></span></div>${t.rows.map(r=>`<label class="checkrow ${r.done?'done':''}"><input type="checkbox" ${r.done?'checked':''} onchange="toggleTrip('${r.id}',this.checked)"><span class="grow">${esc(r.name)}</span><button class="small ghost" type="button" onclick="removeTrip('${r.id}')">×</button></label>`).join('')}<form class="row" style="margin:12px 0" onsubmit="addTrip(event)"><input name="name" placeholder="Добавить вещь" required maxlength="100"><button class="primary">+</button></form><button class="ghost" style="width:100%" onclick="if(confirm('Завершить и очистить список?')){commit(()=>db.trip=null);closeModal();render()}">Завершить выезд</button>`)}function toggleTrip(id,v){commit(()=>db.trip.rows.find(r=>r.id===id).done=v);render();openTrip()}function removeTrip(id){commit(()=>db.trip.rows=db.trip.rows.filter(r=>r.id!==id));render();openTrip()}function addTrip(e){e.preventDefault();let n=new FormData(e.target).get('name').trim();if(n){commit(()=>db.trip.rows.push({id:uid(),name:n,done:false}));render();openTrip()}}
function wish(){return head('Хотелки','Добавить','editWish()')+`<div class="hero" style="min-height:136px"><img src="${ART["box"]}" alt=""><div class="eyebrow">СПИСОК ПОКУПОК</div><div class="value" style="margin-top:8px">${money(db.wishes.reduce((s,w)=>s+w.price,0))}</div><p class="muted tiny">Планируемые расходы · ${db.wishes.length} поз.</p></div><section class="section">${db.wishes.length?db.wishes.map(w=>`<div class="card"><div class="row"><img src="${photo(w)}" alt="" style="width:78px;height:70px;object-fit:cover;border-radius:12px"><div class="grow"><h3>${esc(w.name)}</h3><span class="muted tiny">${esc(cats[w.cat])}</span></div><strong style="color:var(--gold)">${money(w.price)}</strong></div><div style="margin-top:7px"><span class="pill ${w.priority==='Высокий'?'warn':''}">${esc(w.priority)} приоритет</span></div>${productButton(w,'wish')}${w.notes?`<p class="muted tiny" style="margin-top:8px">${esc(w.notes)}</p>`:''}<div class="actions"><button class="primary small" onclick="buyWish('${w.id}')">Куплено</button><button class="ghost small" onclick="editWish('${w.id}')">Изменить</button><button class="ghost danger small" onclick="removeWish('${w.id}')">Удалить</button></div></div>`).join(''):empty('Что хочется купить?','Запишите модель, бюджет и приоритет.','Добавить хотелку','editWish()','heart')}</section>`}
function editWish(id){let w=db.wishes.find(x=>x.id===id)||{cat:'lure',priority:'Средний'};beginGallery(w);dialog(id?'Редактировать хотелку':'Новая хотелка',`<form onsubmit="saveWish(event,'${id||''}')">${galleryEditor("Фото покупки")}${fld('Название *','name',w.name,'text','required maxlength="90"')}<div class="field"><label>Категория</label><select name="cat">${cat.map(([k,n])=>`<option value="${k}" ${w.cat===k?'selected':''}>${n}</option>`).join('')}</select></div>${fld('Планируемая цена, ₽','price',w.price,'number','min="0" step="0.01"')}${fld('Ссылка на товар','url',w.url,'url','maxlength="2048" placeholder="https://..."')}<div class="field"><label>Приоритет</label><select name="priority">${opts(['Высокий','Средний','Низкий'],w.priority)}</select></div><div class="field"><label>Заметки / магазин</label><textarea name="notes" maxlength="1000">${esc(w.notes)}</textarea></div><button class="primary" style="width:100%">Сохранить</button></form>`)}function saveWish(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),w={...f,id:id||uid(),name:f.name.trim(),price:num(f.price),photos:pendingPhotos.slice()};if(!w.name)return toast('Введите название');if(!validProduct(f.url))return toast('Некорректная ссылка');if(!galleryReady())return;if(commit(()=>{let i=db.wishes.findIndex(w=>w.id===id);if(i<0)db.wishes.push(w);else db.wishes[i]=w})){closeModal();render();adAction()}}function removeWish(id){if(confirm('Удалить хотелку?')){commit(()=>db.wishes=db.wishes.filter(w=>w.id!==id));render()}}function buyWish(id){let w=db.wishes.find(w=>w.id===id);dialog('Покупка',`<form onsubmit="confirmBuy(event,'${id}')"><h3>${esc(w.name)}</h3>${fld('Фактическая цена, ₽','price',w.price,'number','min="0" step="0.01" required')}${fld('Количество','qty',1,'number','required min="1" step="1"')}<button class="primary" style="width:100%">Перенести в арсенал</button></form>`)}function confirmBuy(e,id){e.preventDefault();let w=db.wishes.find(x=>x.id===id),f=Object.fromEntries(new FormData(e.target));if(commit(()=>{db.items.push({id:uid(),cat:w.cat,name:w.name,price:num(f.price),qty:Math.max(1,Math.floor(num(f.qty))),date:today(),condition:'Новое',notes:w.notes,url:w.url||'',photos:photosOf(w),sold:false});db.wishes=db.wishes.filter(w=>w.id!==id)})){closeModal();render();adAction();toast('Покупка в арсенале')}}
function more(){return head('Инструменты')+`<div class="seg">${[['stats','Расходы'],['feeder','Фидер'],['settings','Настройки']].map(([k,t])=>`<button class="${moreView===k?'active':''}" onclick="moreView='${k}';render()">${t}</button>`).join('')}</div>${moreView==='stats'?stats():moreView==='feeder'?feeder():settings()}`}
function stats(){let total=worth(db.items),sold=db.items.filter(i=>i.sold).reduce((s,x)=>s+num(x.sale),0),a=active(),groups=cat.map(([k,n])=>[n,worth(a.filter(x=>x.cat===k))]);return `<div class="hero" style="min-height:150px"><img src="${ART["reel"]}" alt=""><div class="eyebrow">ВЛОЖЕНО В СНАСТИ</div><div class="value" style="margin-top:9px">${money(total)}</div><p class="muted tiny">За всё время, по введённым ценам</p></div><div class="stats"><div class="metric"><strong>${money(sold)}</strong><small>Вернулось от продаж</small></div><div class="metric"><strong>${money(total-sold)}</strong><small>Чистые расходы</small></div></div>${section('Структура арсенала','','',`<div class="card">${groups.map(([n,v])=>`<div class="chartrow"><div class="row between"><small>${n}</small><b>${money(v)}</b></div><div class="bar"><span style="width:${cash()?v/cash()*100:0}%"></span></div></div>`).join('')}</div>`)}${section('История покупок','','',db.items.length?db.items.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="card row"><div class="grow"><h3>${esc(x.name)}</h3><p class="muted tiny">${esc(x.date||'Дата не указана')} · ${x.qty} шт.</p></div><b>${money(x.price*x.qty)}</b></div>`).join(''):empty('Нет расходов','Добавьте снасть с ценой покупки.','',''))}`}
function feeder(){let f=db.feeder;return `<div class="card"><div class="eyebrow">ФИДЕР · МИНИ-ИНСТРУМЕНТ</div><div class="timer" id="timer">--:--</div><div class="row between"><span class="muted tiny">Интервал перезаброса</span><input aria-label="Интервал минут" type="number" min="1" max="120" value="${f.minutes}" style="width:88px" onchange="commit(()=>db.feeder.minutes=Math.min(120,Math.max(1,Math.round(num(this.value)))))"></div><div class="split" style="margin-top:12px"><button class="primary" onclick="cast()">Перезаброс</button><button onclick="bite()">Поклёвка</button></div><div class="stats"><div class="metric"><strong>${f.casts}</strong><small>Забросы</small></div><div class="metric"><strong>${f.bites}</strong><small>Поклёвки</small></div></div><button class="ghost" style="width:100%;margin-top:10px" onclick="if(confirm('Сбросить сессию?')){commit(()=>{db.feeder.casts=0;db.feeder.bites=0;db.feeder.end=0});render()}">Сбросить сессию</button><p class="note" style="margin-top:12px">Таймер учитывает прошедшее время, но не подаёт сигнал при заблокированном экране. Для фоновых уведомлений понадобится нативная доработка.</p></div><div class="card"><h2>Дистанция по колышкам</h2><p class="muted tiny" style="margin:6px 0 12px">Один полный оборот вокруг двух колышков ≈ два расстояния между ними.</p><div class="split"><div><label>Между колышками, м</label><input id="stake" type="number" min="0" step="0.1" value="3" oninput="calcDistance()"></div><div><label>Полных оборотов</label><input id="wrap" type="number" min="0" step="0.5" value="6" oninput="calcDistance()"></div></div><div class="value" id="distance" style="font-size:30px;font-weight:750;color:var(--gold);margin-top:10px">36 м</div></div>`}function calcDistance(){let n=num($('#stake').value)*2*num($('#wrap').value);$('#distance').textContent=+(n.toFixed(2))+' м'}function cast(){commit(()=>{db.feeder.casts++;db.feeder.end=Date.now()+db.feeder.minutes*60000});render()}function bite(){commit(()=>db.feeder.bites++);render()}function updateTimer(){let el=$('#timer');if(!el)return;let end=db.feeder.end,sec=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=end?String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'):'--:--';el.classList.toggle('due',!!end&&sec===0)}setInterval(updateTimer,1000);
function settings(){return `${proCard()}<div class="card"><h2>Ваши данные</h2><p class="muted tiny" style="margin:8px 0 13px">Коллекция хранится на устройстве. Регистрация не нужна. Перед удалением приложения сохраните резервную копию.</p><div class="stack"><button onclick="backup()">${I('share')} Экспорт / резервная копия</button><label class="card" style="margin:0">Импорт JSON<input type="file" accept="application/json,text/plain,.json" onchange="importBackup(this)" style="margin-top:8px"></label><button class="ghost" onclick="pasteBackup()">Импорт из текста</button></div></div><div class="card"><h2>Демо и обслуживание</h2><div class="stack" style="margin-top:12px"><button class="ghost" onclick="demo()">Добавить демонстрационные данные</button><button class="danger ghost" onclick="clearDemo()">Удалить демо-данные</button><button class="danger ghost" onclick="if(confirm('Удалить ВСЕ данные без возможности восстановления?')){commit(()=>db=blank());render();toast('Данные очищены')}">Очистить всё</button></div></div><div class="card"><h3>Арсенал рыбака · 0.5.0</h3><p class="muted tiny">Личная коллекция и журнал рыбалок. Бесплатная версия с рекламой. PRO — единоразовая покупка без рекламы после запуска оплаты. Суммы — пользовательские оценки, не рыночные котировки.</p></div>`}
function shareKit(id){let k=db.kits.find(x=>x.id===id);if(k)shareText("🎣 "+k.name+"\n"+kitItems(k).map(x=>"• "+x.name).join("\n")+"\nАрсенал рыбака")}function shareText(text){if(text.length>100000){dialog('Поделиться',`<p class="note">Текст слишком большой для системной отправки. Скопируйте вручную.</p><textarea id="shareData">${esc(text)}</textarea><button class="primary" onclick="copyText('shareData')">Скопировать</button>`);return}if(location.protocol==='file:'&&/Android/i.test(navigator.userAgent)){location.href='arsenal://share?text='+encodeURIComponent(text);return}if(navigator.share)navigator.share({text}).catch(()=>{});else dialog('Поделиться',`<textarea id="shareData" style="min-height:160px">${esc(text)}</textarea><button class="primary" style="width:100%;margin-top:8px" onclick="copyText('shareData')">Скопировать</button>`)}function copyText(id){let e=$('#'+id);e.focus();e.select();try{if(document.execCommand('copy'))toast('Скопировано');else toast('Выделите и скопируйте текст вручную')}catch{toast('Скопируйте выделенный текст')}}
function backup(){let raw=JSON.stringify(db);dialog('Резервная копия',`<p class="note">Полный JSON включает фотографии. На Android скопируйте текст и сохраните его в файл или заметку. В браузере можно скачать файл.</p><textarea id="backupData" style="min-height:170px;margin:12px 0">${esc(raw)}</textarea><div class="stack"><button class="primary" onclick="copyText('backupData')">Скопировать JSON</button><button onclick="downloadBackup()">Сохранить JSON в файл</button><button class="ghost" onclick="shareText(JSON.stringify({...db,items:db.items.map(x=>({...x,photo:'',photos:[]})),wishes:db.wishes.map(x=>({...x,photo:'',photos:[]})),trophies:db.trophies.map(x=>({...x,photos:[]}))}))">Поделиться JSON без фото</button></div>`)}function downloadBackup(){if(window.ArsenalNative){if(!window.ArsenalNative.exportBackup(JSON.stringify(db),'arsenal-'+today()+'.json'))toast('Не удалось начать сохранение');return}let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.href=url;a.download='arsenal-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function pasteBackup(){dialog('Импорт из текста',`<p class="note">Импорт заменяет текущие данные. Сначала сделайте резервную копию.</p><textarea id="importData" placeholder="Вставьте JSON" style="margin:12px 0;min-height:160px"></textarea><button class="primary" style="width:100%" onclick="restoreBackup($('#importData').value)">Импортировать</button>`)}async function importBackup(el){try{let f=el.files[0];if(f)restoreBackup(await f.text())}catch{toast('Не удалось прочитать файл')}}
function restoreBackup(raw){try{let x=JSON.parse(raw);if(x.version!==1||!Array.isArray(x.items)||!Array.isArray(x.kits)||!Array.isArray(x.wishes)||x.items.length>10000||x.kits.length>1000||x.wishes.length>10000)throw Error();let validId=s=>typeof s==='string'&&/^[a-zA-Z0-9_-]{1,60}$/.test(s),name=s=>typeof s==='string'&&s.length>0&&s.length<=1000;if(!x.items.every(i=>validId(i.id)&&name(i.name)&&cats[i.cat]&&Number.isFinite(i.price)&&i.qty>=1&&Number.isFinite(i.qty))||new Set(x.items.map(i=>i.id)).size!==x.items.length||!x.kits.every(k=>validId(k.id)&&name(k.name)&&Array.isArray(k.items)&&k.items.every(validId))||!x.wishes.every(w=>validId(w.id)&&name(w.name)&&cats[w.cat]&&Number.isFinite(w.price))||x.trip&&(!Array.isArray(x.trip.rows)||!x.trip.rows.every(r=>validId(r.id)&&name(r.name))))throw Error();if(x.trophies!==undefined&&(!Array.isArray(x.trophies)||x.trophies.length>10000||!x.trophies.every(t=>validId(t.id)&&name(t.species)&&Number.isFinite(t.weight)&&Number.isFinite(t.length)&&Array.isArray(t.gear)&&t.gear.every(g=>validId(g.id)&&name(g.name)))||new Set(x.trophies.map(t=>t.id)).size!==x.trophies.length))throw Error();for(const a of [x.items,x.wishes,x.trophies||[]])for(const p of a){p.photos=photosOf(p);delete p.photo;if(!validProduct(p.url))p.url=''}if(!confirm('Заменить текущие данные резервной копией?'))return;let clean={...blank(),...x,feeder:{...blank().feeder,...x.feeder}};if(commit(()=>db=clean)){closeModal();render();toast('Резервная копия восстановлена')}}catch{toast('Файл не соответствует формату Арсенала')}}
function demo(){if(db.items.some(i=>i.demo))return toast('Демо уже добавлено');if(!confirm('Добавить вымышленные примеры? Их можно удалить в настройках.'))return;let demoItems=[['rod','Maximus High Energy-X','Maximus',8500,1,'Тубус',5,25,2.4,0],['reel','Nasci C2500','Shimano',12600,1,'Чехол',0,0,0,0],['lure','Minnow 90 SP','Пример',1100,3,'Коробка № 1',0,0,0,11],['lure','Колебалка 32 г','Пример',550,2,'Коробка № 2',0,0,0,32],['line','PE #0.8, 150 м','Пример',1800,1,'Шкаф',0,0,0,0],['hook','Офсет 2/0','Пример',55,12,'Органайзер',0,0,0,0],['box','Коробка для воблеров','Пример',1400,1,'Рюкзак',0,0,0,0]].map(([cat,name,brand,price,qty,location,testMin,testMax,length,weight])=>({id:uid(),cat,name,brand,price,qty,location,testMin,testMax,length,weight,date:today(),condition:'Хорошее',demo:true,sold:false,notes:'Демонстрационная запись'}));if(commit(()=>{db.items.push(...demoItems);db.kits.push({id:uid(),name:'Спиннинг на щуку',type:'Спиннинг',items:demoItems.slice(0,5).map(i=>i.id),notes:'Пример. Включена тяжёлая блесна для проверки теста.',demo:true});db.wishes.push({id:uid(),name:'Запасная шпуля',cat:'reel',price:2400,priority:'Средний',notes:'Демонстрация',demo:true})})){render();toast('Демонстрационные данные добавлены')}}function clearDemo(){if(confirm('Удалить только демонстрационные записи?')){let ids=new Set(db.items.filter(x=>x.demo).map(x=>x.id));commit(()=>{db.items=db.items.filter(x=>!x.demo);db.kits=db.kits.filter(x=>!x.demo);db.kits.forEach(k=>k.items=k.items.filter(i=>!ids.has(i)));db.wishes=db.wishes.filter(x=>!x.demo)});render()}}
let galleryToken=0,galleryBusy=false,galleryFailed=false,pendingPhotos=[];
function photosOf(x){return (Array.isArray(x?.photos)?x.photos:[x?.photo]).filter(s=>typeof s==='string'&&s.length<=1000000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)).slice(0,4)}
function beginGallery(x){galleryToken++;galleryBusy=false;galleryFailed=false;pendingPhotos=photosOf(x)}
function galleryEditor(label){return `<h3>${esc(label)}</h3><p class="muted tiny">До 4 фотографий · первая — обложка</p><div id="galleryGrid">${galleryThumbs()}</div><div id="galleryStatus" class="photo-status" role="status">${pendingPhotos.length?pendingPhotos.length+' из 4 фото':'Фото не выбрано'}</div>${window.ArsenalNative?.pickPhotos?`<button type="button" class="ghost gallery-pick" onclick="pickNativePhotos()">${I('plus')} Выбрать фото из галереи</button>`:`<label class="gallery-add">Выбрать фото<input type="file" accept="image/*" multiple onchange="choosePhoto(this)"></label>`}<button type="button" id="gallerySkip" class="ghost small" style="display:none;margin-bottom:12px" onclick="skipPhotoError()">Продолжить без неудачных фото</button>`}
function galleryThumbs(){return pendingPhotos.length?`<div class="gallery-grid">${pendingPhotos.map((p,i)=>`<div class="gallery-tile"><img src="${p}" alt="Фото ${i+1}"><button type="button" aria-label="Удалить фото" onclick="removeGallery(${i})">×</button></div>`).join('')}</div>`:`<p class="note" style="margin:8px 0">Пока нет своих фотографий.</p>`}
function removeGallery(i){if(galleryBusy)return;pendingPhotos.splice(i,1);refreshGallery();}
async function compressPhoto(f){if(f.size>25e6)throw Error();const img=new Image(),url=URL.createObjectURL(f);try{await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});let c=document.createElement('canvas'),out='';for(let size of [900,720,560,400]){let scale=Math.min(1,size/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='#151b17';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);for(let q of [.78,.62,.48]){out=c.toDataURL('image/jpeg',q);if(out.length<=100000)return out}}if(out.length>250000)throw Error();return out}finally{URL.revokeObjectURL(url)}}
async function addGalleryPhotos(input){if(galleryBusy)return;let token=galleryToken,files=Array.from(input.files||[]).slice(0,4-pendingPhotos.length);if(!files.length){input.value='';return}galleryBusy=true;galleryFailed=false;input.disabled=true;refreshGallery('Загрузка фотографий…');let failed=0;try{for(let f of files){try{let p=await compressPhoto(f);if(token!==galleryToken)return;if(!photosOf({photos:[p]}).length)throw Error();pendingPhotos.push(p)}catch{failed++}}}finally{if(token===galleryToken){galleryBusy=false;galleryFailed=failed>0;input.disabled=false;input.value='';refreshGallery()}}}
function refreshGallery(message){let g=$('#galleryGrid'),s=$('#galleryStatus'),b=$('#gallerySkip');if(g)g.innerHTML=galleryThumbs();if(s){s.textContent=message||(galleryFailed?'Не все фото удалось загрузить. Повторите выбор или подтвердите пропуск.':pendingPhotos.length+' из 4 фото готовы к сохранению');s.classList?.toggle('warn',galleryFailed)}if(b)b.style.display=galleryFailed?'block':'none'}
function galleryReady(){if(galleryBusy){toast('Подождите, фотографии загружаются');return false}if(galleryFailed){toast('Повторите выбор фото или подтвердите пропуск');return false}return true}
function skipPhotoError(){galleryFailed=false;refreshGallery()}
function pickNativePhotos(){if(galleryBusy)return;if(pendingPhotos.length>=4)return toast('Максимум 4 фото');galleryBusy=true;galleryFailed=false;refreshGallery('Выберите фотографии…');if(!window.ArsenalNative.pickPhotos(galleryToken,4-pendingPhotos.length)){galleryBusy=false;galleryFailed=true;refreshGallery()}}
function receiveNativePhotos(token,photos,failed,cancelled){if(token!==galleryToken)return;galleryBusy=false;let valid=photosOf({photos:Array.isArray(photos)?photos:[]});pendingPhotos=pendingPhotos.concat(valid).slice(0,4);galleryFailed=!cancelled&&(failed>0||valid.length!==(photos||[]).length);refreshGallery();if(!cancelled&&valid.length)toast('Фото добавлено: '+valid.length)}
function galleryView(x,fallback=''){let p=photosOf(x);return !p.length?(fallback?`<img class="detailhero" src="${fallback}" alt="">`:`<div class="catch-placeholder">${I('trophy')}</div>`):`<img class="gallery-main" id="galleryMain" src="${p[0]}" alt="Фото">${p.length>1?`<div class="gallery-strip">${p.map((s,i)=>`<button type="button" aria-label="Фото ${i+1}" onclick="$('#galleryMain').src=this.querySelector('img').src"><img src="${s}" alt=""></button>`).join('')}</div>`:''}`}
function validProduct(v){if(v==null||v==='')return true;if(typeof v!=='string')return false;try{let u=new URL(v.trim());return ['http:','https:'].includes(u.protocol)&&!!u.hostname&&!u.username&&!u.password&&v.length<=2048}catch{return false}}
function productButton(x,k){return x.url&&validProduct(x.url)?`<button class="ghost linkbutton" onclick="openProduct('${x.id}','${k}')">↗ ${esc(new URL(x.url).hostname)} · Открыть товар</button>`:''}
function openProduct(id,k){let x=(k==='wish'?db.wishes:db.items).find(i=>i.id===id);if(!x?.url||!validProduct(x.url))return;let url=new URL(x.url).href;if(window.ArsenalNative){if(!window.ArsenalNative.openProduct(url))toast('Не удалось открыть ссылку')}else window.open(url,'_blank','noopener,noreferrer')}
function fmtWeight(w){return num(w)>0?num(w).toLocaleString('ru-RU',{maximumFractionDigits:3})+' кг':'—'}
function trophyHome(){let b=db.trophies.reduce((m,t)=>Math.max(m,num(t.weight)),0);return `<button class="trophy-home" onclick="page('trophy')">${I('trophy')}<span class="grow"><b>Зал трофеев</b><small>${db.trophies.length?db.trophies.length+' записей · рекорд '+fmtWeight(b):'Ваши уловы и личные рекорды'}</small></span>${I('arrow')}</button>`}
function trophyRecords(){let m=new Map();for(let t of db.trophies){if(!num(t.weight)&&!num(t.length))continue;let k=String(t.species||'').trim().toLowerCase().replace(/ё/g,'е');let a=m.get(k);if(!a||num(t.weight)>num(a.weight)||num(t.weight)===num(a.weight)&&num(t.length)>num(a.length))m.set(k,t)}return [...m.values()].sort((a,b)=>num(b.weight)-num(a.weight))}
function trophy(){let rows=db.trophies.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||db.trophies.indexOf(b)-db.trophies.indexOf(a)),best=rows.reduce((m,t)=>Math.max(m,num(t.weight)),0),records=trophyRecords();return head('Трофеи','Добавить','editTrophy()')+`<div class="trophy-hero"><div class="eyebrow">ЛИЧНЫЕ РЕКОРДЫ</div><h1>Моя рыбалка</h1><div class="value">${fmtWeight(best)}</div><div class="muted tiny">${best?'Самый тяжёлый трофей':'Вес ещё не указан'} · ${rows.length} записей</div></div>${records.length?section('Рекорды по видам','','',`<div class="card">${records.map(t=>`<button class="ghost row between" style="width:100%;margin-bottom:5px" onclick="trophyDetail('${t.id}')"><span>${esc(t.species)}</span><b>${fmtWeight(t.weight)}${num(t.length)?' · '+num(t.length)+' см':''}</b></button>`).join('')}</div>`):''}${section('Фотоальбом','','',rows.length?`<div class="catch-grid">${rows.map(t=>`<button class="catch-card" onclick="trophyDetail('${t.id}')">${photosOf(t)[0]?`<img class="cover" src="${photosOf(t)[0]}" alt="">`:`<div class="catch-placeholder">${I('trophy')}</div>`}<div class="catch-body"><h3>${esc(t.species)}</h3><div class="weight">${num(t.weight)?fmtWeight(t.weight):num(t.length)?num(t.length)+' см':'Без замеров'}</div><p class="muted tiny">${esc(t.date||'')}${t.water?' · '+esc(t.water):''}</p></div></button>`).join('')}</div>`:empty('Первый трофей','Добавьте фото улова, вид, вес и снасти.','Записать улов','editTrophy()','trophy'))}`}
function editTrophy(id='',gearId=''){let t=db.trophies.find(x=>x.id===id)||{species:'',date:today(),gear:gearId?db.items.filter(x=>x.id===gearId).map(x=>({id:x.id,name:x.name})):[]};beginGallery(t);let gs=t.gear||[],selected=gs.map(g=>g.id);dialog(id?'Редактировать трофей':'Новый трофей',`<form onsubmit="saveTrophy(event,'${id}')">${galleryEditor('Фото улова')}${fld('Вид рыбы *','species',t.species,'text','required maxlength="60" list="fishSpecies"')}<datalist id="fishSpecies">${['Щука','Окунь','Судак','Лещ','Карась','Карп','Плотва','Сом','Жерех','Голавль','Форель','Налим'].map(s=>`<option value="${s}"></option>`).join('')}</datalist><div class="split">${fld('Вес, кг','weight',t.weight||'','number','min="0" max="1000" step="0.001"')}${fld('Длина, см','length',t.length||'','number','min="0" max="1000" step="0.1"')}</div>${fld('Дата','date',t.date||today(),'date','required')}${fld('Водоём (необязательно)','water',t.water,'text','maxlength="100"')}${fld('Способ ловли','method',t.method,'text','maxlength="60"')}<label class="checkrow"><input type="checkbox" name="released" ${t.released?'checked':''}> Рыба отпущена</label><h3>Снасти (необязательно)</h3><p class="muted tiny">Отметьте удилище, катушку или приманку, на которые поймали рыбу. Так появится история в карточке снасти.</p><div class="gear-links">${db.items.filter(x=>!x.sold||selected.includes(x.id)).map(x=>`<label class="checkrow"><input type="checkbox" name="gear" value="${x.id}" ${selected.includes(x.id)?'checked':''}><img src="${photo(x)}" style="width:40px;height:40px;object-fit:cover"><span>${esc(x.name)}${x.sold?' · продано':''}</span></label>`).join('')}${gs.filter(g=>!db.items.some(x=>x.id===g.id)).map(g=>`<label class="checkrow"><input type="checkbox" name="gear" value="${g.id}" checked>${esc(g.name)} · удалено</label>`).join('')}</div><div class="field"><label>История улова</label><textarea name="notes" maxlength="2000">${esc(t.notes)}</textarea></div><button class="primary" style="width:100%">Сохранить</button></form>`)}
function saveTrophy(e,id){e.preventDefault();if(!galleryReady())return;let f=new FormData(e.target),species=String(f.get('species')||'').trim(),old=db.trophies.find(x=>x.id===id);if(!species||!f.get('date'))return toast('Введите вид и дату');if(f.get('date')>today())return toast('Дата улова не может быть в будущем');let gear=f.getAll('gear').map(g=>{let x=db.items.find(i=>i.id===g);return x?{id:x.id,name:x.name}:(old?.gear||[]).find(i=>i.id===g)}).filter(Boolean),t={id:id||uid(),species,weight:num(f.get('weight')),length:num(f.get('length')),date:f.get('date'),water:f.get('water')||'',method:f.get('method')||'',released:f.get('released')==='on',notes:f.get('notes')||'',gear,photos:pendingPhotos.slice()};if(commit(()=>{if(old)db.trophies[db.trophies.indexOf(old)]=t;else db.trophies.push(t)})){closeModal();page('trophy');adAction();toast('Трофей сохранён'+(t.photos.length?' · фото: '+t.photos.length:''))}}
function trophyDetail(id){let t=db.trophies.find(x=>x.id===id);if(!t)return;dialog(esc(t.species),`${galleryView(t)}<div class="row between" style="margin:12px 0"><strong style="font-size:30px;color:var(--gold)">${fmtWeight(t.weight)}</strong>${(num(t.weight)>0||num(t.length)>0)&&trophyRecords().some(r=>r.id===id)?'<span class="pill warn">Личный рекорд</span>':''}</div>${[['Длина',t.length?t.length+' см':''],['Дата',t.date],['Водоём',t.water],['Способ',t.method],['Отпущена',t.released?'Да':'Не отмечено']].filter(x=>x[1]).map(([k,v])=>`<div class="listline"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join('')}${(t.gear||[]).map(g=>{let x=db.items.find(i=>i.id===g.id);return x?itemrow(x):`<p class="note">${esc(g.name)} · нет в арсенале</p>`}).join('')}${t.notes?`<p class="note" style="white-space:pre-wrap">${esc(t.notes)}</p>`:''}<div class="stack" style="margin-top:14px"><button class="primary" onclick="editTrophy('${id}')">Редактировать</button><button onclick="shareTrophy('${id}')">${I('share')} Поделиться результатом</button><button onclick="exportTrophyCard('${id}')">Сохранить карточку JPG</button><button class="danger ghost" onclick="removeTrophy('${id}')">Удалить</button></div>`)}
function removeTrophy(id){if(confirm('Удалить трофей?')&&commit(()=>db.trophies=db.trophies.filter(t=>t.id!==id))){closeModal();render()}}
function gearTrophyStats(id){let a=db.trophies.filter(t=>(t.gear||[]).some(g=>g.id===id));if(!a.length)return '';let best=a.reduce((m,t)=>!m||num(t.weight)>num(m.weight)?t:m,null);return `<div class="card" style="margin-top:12px"><div class="eyebrow">ТРОФЕИ НА ЭТУ СНАСТЬ</div><div class="stats"><div class="metric"><strong>${a.length}</strong><small>Уловов в журнале</small></div><div class="metric"><strong>${fmtWeight(best?.weight)}</strong><small>Макс. вес</small></div></div><button class="ghost" style="width:100%" onclick="trophyDetail('${best.id}')">${esc(best.species)} · Открыть трофей</button></div>`}
function shareTrophy(id){let t=db.trophies.find(x=>x.id===id);if(t)shareText('🎣 '+t.species+' · '+fmtWeight(t.weight)+(t.length?' · '+t.length+' см':'')+(t.released?'\nПоймал — отпустил':'')+'\nАрсенал рыбака')}
async function exportTrophyCard(id){let t=db.trophies.find(x=>x.id===id);if(!t)return;try{let c=document.createElement('canvas');c.width=900;c.height=1100;let ctx=c.getContext('2d');ctx.fillStyle='#17211b';ctx.fillRect(0,0,900,1100);let p=photosOf(t)[0];if(p){let im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=p});let s=Math.min(900/im.width,700/im.height),w=im.width*s,h=im.height*s;ctx.drawImage(im,(900-w)/2,(700-h)/2,w,h)}else{ctx.fillStyle='#304436';ctx.fillRect(0,0,900,700);ctx.fillStyle='#edc78b';ctx.font='bold 55px sans-serif';ctx.fillText('ЛИЧНЫЙ ТРОФЕЙ',40,350,820)}ctx.fillStyle='#edc78b';ctx.font='bold 30px sans-serif';ctx.fillText('АРСЕНАЛ РЫБАКА',42,770);ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText(t.species,42,845,816);ctx.font='bold 65px sans-serif';ctx.fillText(fmtWeight(t.weight),42,940,816);ctx.fillStyle='#a8b7ac';ctx.font='30px sans-serif';ctx.fillText([t.length?t.length+' см':'',t.date,t.released?'Отпущена':''].filter(Boolean).join(' · '),42,1010,816);let raw=c.toDataURL('image/jpeg',.9);if(window.ArsenalNative){if(!window.ArsenalNative.exportImage(raw.split(',')[1],'trophy-'+today()+'.jpg'))toast('Не удалось начать сохранение')}else{let a=document.createElement('a');a.href=raw;a.download='trophy-'+today()+'.jpg';a.click()}}catch{toast('Не удалось создать карточку')}}
function ratingCard(){return `<div class="rating-card"><div class="grow"><div class="stars">★★★★★</div><h3>Нравится приложение?</h3><p class="muted tiny">Оцените в RuStore после публикации</p></div><button class="ghost small" onclick="rateApp()">Оценить</button></div>`}
function rateApp(){let url='https://www.rustore.ru/catalog/app/ru.crystalgames.arsenal';if(window.ArsenalNative?.rateApp){window.ArsenalNative.rateApp()}else if(typeof window.open==='function'){window.open(url,'_blank','noopener,noreferrer')}else toast('Карточка появится после публикации в RuStore')}
function proCard(){let active=!!window.ArsenalNative?.isPro?.(),ready=!!window.ArsenalNative?.proConfigured?.();return `<div class="card row" style="border-color:#6e5c3f;background:linear-gradient(115deg,#3b3426,#222c23);margin:12px 0"><div class="grow"><div class="eyebrow">АРСЕНАЛ PRO</div><h3>${active?'PRO активирован':'Без рекламы · 399 ₽'}</h3><p class="muted tiny">${active?'Восстановление покупки':ready?'Разовая покупка, без подписки':'Оплата пока не подключена'}</p></div><button class="ghost small" onclick="openProInfo()">${active?'Управление':'Подробнее'}</button></div>`}
function openProInfo(){if(window.ArsenalNative?.openPro)window.ArsenalNative.openPro();else toast('Покупка доступна только в Android-приложении после запуска оплаты')}
render();
</script></body></html>
