plugins { id 'com.android.application' }
def licenseUrl = (findProperty('ARSENAL_LICENSE_URL') ?: '').toString()
while (licenseUrl.endsWith('/')) licenseUrl = licenseUrl.substring(0,licenseUrl.length()-1)
if (licenseUrl && !(licenseUrl ==~ /https:\/\/[a-zA-Z0-9.-]+(:[0-9]+)?(\/[a-zA-Z0-9_-]+)*/)) throw new GradleException('Invalid HTTPS license URL')
android {
 namespace 'ru.crystalgames.arsenal'
 compileSdk 35
 defaultConfig {
  applicationId 'ru.crystalgames.arsenal'
  minSdk 26
  targetSdk 34
  versionCode 9
  versionName '0.6.1'
  buildConfigField 'String', 'LICENSE_BASE_URL', '"' + licenseUrl + '"'
 }
 buildFeatures { buildConfig true }
 buildTypes {
  debug {
   applicationIdSuffix '.test'
   versionNameSuffix '-test'
   resValue 'string', 'app_name', 'Арсенал рыбака TEST'
   buildConfigField 'String', 'MAIN_AD', '"demo-banner-yandex"'
   buildConfigField 'String', 'CATALOG_AD', '"demo-banner-yandex"'
   buildConfigField 'String', 'INTER_AD', '"demo-interstitial-yandex"'
  }
  release {
   resValue 'string', 'app_name', 'Арсенал рыбака'
   buildConfigField 'String', 'LICENSE_BASE_URL', '""'
   buildConfigField 'String', 'MAIN_AD', '"R-M-20514578-1"'
   buildConfigField 'String', 'CATALOG_AD', '"R-M-20514578-2"'
   buildConfigField 'String', 'INTER_AD', '"R-M-20514578-3"'
   minifyEnabled false
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.yandex.android:mobileads:8.7.0' }
