name: Review high-action jumping carp footage
on:
  push:
    branches: [codex/shpargalka-action-shotcut]
    paths:
      - video_production/usfws_jump_preview.py
      - .github/workflows/shpargalka-usfws-action-preview.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4 pillow playwright imageio-ffmpeg
      - run: python -u video_production/usfws_jump_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Carp-Jump-Scene-Review
          path: video_production/usfws_jump_review/*CONTACT.jpg
          retention-days: 3
