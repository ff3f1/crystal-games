name: Probe new fishing footage
on:
  push:
    branches: [codex/shpargalka-5min-rework]
    paths:
      - video_production/source_probe.py
      - .github/workflows/shpargalka-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python -u video_production/source_probe.py
