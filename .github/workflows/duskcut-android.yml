name: DUSK CUT - Android APK / RuStore media
on:
  push:
    paths:
      - 'android-duskcut/**'
      - '.github/workflows/duskcut-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Reuse the existing release keystore secrets shared with the other Android games.
      # DUSK-specific secrets, if defined, take precedence over shared ones.
      DUSK_KEYSTORE_BASE64: ${{ secrets.DUSK_KEYSTORE_BASE64 || secrets.KEYSTORE_B64 }}
      DUSK_STORE_PASSWORD: ${{ secrets.DUSK_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      DUSK_KEY_ALIAS: ${{ secrets.DUSK_KEY_ALIAS || secrets.KEY_ALIAS }}
      DUSK_KEY_PASSWORD: ${{ secrets.DUSK_KEY_PASSWORD || secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK (fixed deprecated tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract game and store assets
        run: |
          cat android-duskcut/assets-parts/part-*.bin > /tmp/dusk-assets.zip
          unzip -o -q /tmp/dusk-assets.zip -d android-duskcut
          test -s android-duskcut/app/src/main/assets/www/assets/hero.webp
          test -s android-duskcut/RUSTORE_MEDIA/icon_512.png
      - name: Validate ads and game assets
        run: |
          grep -q 'R-M-20492584-1' android-duskcut/app/build.gradle
          grep -q 'R-M-20492584-2' android-duskcut/app/build.gradle
          grep -q 'R-M-20492584-3' android-duskcut/app/build.gradle
          grep -q 'mobileTouchHandler' android-duskcut/app/src/main/assets/www/index.html
          grep -q 'window.androidRewardClosed' android-duskcut/app/src/main/assets/www/index.html
          file android-duskcut/RUSTORE_MEDIA/icon_512.png
      - name: Build installable test APK
        working-directory: android-duskcut
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DUSK-CUT-2.6.6-Android-TEST-APK
          path: android-duskcut/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build signed RuStore release APK (when signing secrets exist)
        if: ${{ env.DUSK_KEYSTORE_BASE64 != '' }}
        working-directory: android-duskcut
        run: |
          test -n "$DUSK_STORE_PASSWORD"
          test -n "$DUSK_KEY_ALIAS"
          test -n "$DUSK_KEY_PASSWORD"
          printf '%s' "$DUSK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duskcut-release.jks"
          export DUSK_STORE_FILE="$RUNNER_TEMP/duskcut-release.jks"
          gradle --no-daemon --stacktrace assembleRelease
          rm -f "$DUSK_STORE_FILE"
      - name: Upload signed RuStore APK (when signing secrets exist)
        if: ${{ env.DUSK_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DUSK-CUT-2.6.6-RUSTORE-SIGNED-RELEASE
          path: android-duskcut/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload RuStore media and moderation texts
        uses: actions/upload-artifact@v4
        with:
          name: DUSK-CUT-2.6.6-RuStore-MEDIA
          path: |
            android-duskcut/RUSTORE_MEDIA/*
            android-duskcut/STORE_TEXT_RU.txt
            android-duskcut/RUSTORE_METADATA.txt
            android-duskcut/RUSTORE_MODERATION.md
          if-no-files-found: error
          retention-days: 30
