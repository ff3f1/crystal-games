name: DUSK CUT - Android APK / RuStore media
on:
  push:
    paths:
      - 'android-duskcut/**'
      - '.github/workflows/duskcut-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract game and store assets
        run: |
          cat android-duskcut/assets-parts/part-*.bin > /tmp/dusk-assets.zip
          unzip -o -q /tmp/dusk-assets.zip -d android-duskcut
          test -s android-duskcut/app/src/main/assets/www/assets/hero.webp
          test -s android-duskcut/RUSTORE_MEDIA/icon_512.png
      - name: Validate ads and game assets
        run: |
          grep -q 'R-M-20492584-1' android-duskcut/app/build.gradle
          grep -q 'R-M-20492584-2' android-duskcut/app/build.gradle
          grep -q 'window.androidRewardClosed' android-duskcut/app/src/main/assets/www/index.html
          file android-duskcut/RUSTORE_MEDIA/icon_512.png
      - name: Build installable test APK
        working-directory: android-duskcut
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DUSK-CUT-2.6.5-Android-TEST-APK
          path: android-duskcut/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload RuStore media and moderation texts
        uses: actions/upload-artifact@v4
        with:
          name: DUSK-CUT-2.6.5-RuStore-MEDIA
          path: |
            android-duskcut/RUSTORE_MEDIA/*
            android-duskcut/STORE_TEXT_RU.txt
            android-duskcut/RUSTORE_METADATA.txt
            android-duskcut/RUSTORE_MODERATION.md
          if-no-files-found: error
          retention-days: 30
