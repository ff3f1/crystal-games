name: Inspect FWS public footage via browser
on:
  push:
    branches: [codex/shpargalka-5min-rework]
    paths:
      - video_production/source_probe_browser.py
      - .github/workflows/shpargalka-browser-probe.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright
      - run: python -u video_production/source_probe_browser.py
