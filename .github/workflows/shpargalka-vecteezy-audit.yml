name: Check free sport fishing action footage
on:
  push:
    branches: [codex/shpargalka-real-story-cut]
    paths: [video_production/vecteezy_source_probe.py, .github/workflows/shpargalka-vecteezy-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: video_production}
      - run: python -m pip install -q requests beautifulsoup4
      - run: python -u video_production/vecteezy_source_probe.py
