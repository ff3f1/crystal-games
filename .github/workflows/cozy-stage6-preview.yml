name: Cozy Stage 6 - end-to-end QA and side-by-side APK
on:
  push:
    branches: [feature/cozy-realistic-art-review]
    paths:
      - 'games/fish/**'
      - 'tests/**'
      - '.github/workflows/cozy-stage6-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-game:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Check source, ecology, FX and real art assets
        run: |
          node --check games/fish/js/cozy-realistic-art.js
          node --check games/fish/js/cozy-inventory.js
          node --check games/fish/js/cozy-gear.js
          node --check games/fish/js/fishing-ecology.js
          node --check games/fish/js/cozy-fight.js
          node --check games/fish/js/cozy-feedback.js
          node tests/test_cozy_real_art.cjs
          node tests/test_cozy_feedback.cjs
          node tests/test_cozy_fight.cjs
          node tests/test_fishing_ecology.cjs
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("games/fish/assets/cozy/*.svg"): ET.parse(f)
          print("SVG files: valid XML")
          PY
      - name: Actual game mobile-browser smoke and screenshots
        run: |
          npm install --prefix "$RUNNER_TEMP/cozyqa" playwright@1.56.1
          python3 -m http.server 8080 --directory games/fish >/tmp/cozyqa-http.log 2>&1 &
          NODE_PATH="$RUNNER_TEMP/cozyqa/node_modules" \
          FISH_URL=http://127.0.0.1:8080 node tests/capture_cozy_real_art.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage6-real-game-screenshots
          path: work/real-art-review/
          retention-days: 14
  preview-apk:
    needs: [verify-game]
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy full current game into Android WebView assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r games/fish/. android/app/src/main/assets/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp store/fish/icons/ic_launcher_$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - name: Build independently installable debug APK with demo ad blocks
        working-directory: android
        run: >-
          gradle :app:assembleDebug --no-daemon
          -PappId=ru.crystalgames.fishing.cozy
          '-PappName=Рыбалка Cozy Preview'
          -PversionCode=2300 -PversionName=2.3-preview
          -PadInter=demo-interstitial-yandex -PadReward=demo-rewarded-yandex
      - name: Check APK and bundled art
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/*.apk output/Rybalka_Cozy_Stage6_RealArt.apk
          unzip -t output/Rybalka_Cozy_Stage6_RealArt.apk | tail -1
          unzip -Z1 output/Rybalka_Cozy_Stage6_RealArt.apk | grep -q '^assets/js/cozy-realistic-art.js$'
          unzip -Z1 output/Rybalka_Cozy_Stage6_RealArt.apk | grep -q '^assets/equipment/spoon.png$'
          unzip -Z1 output/Rybalka_Cozy_Stage6_RealArt.apk | grep -q '^assets/equipment/float_waggler.png$'
          unzip -Z1 output/Rybalka_Cozy_Stage6_RealArt.apk | grep -q '^assets/js/fishing-ecology.js$'
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-stage6-real-art-side-by-side-apk
          path: output/
          retention-days: 14
