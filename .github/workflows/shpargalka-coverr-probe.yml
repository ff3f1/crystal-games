name: Inspect Coverr fishing reels and action clips
on:
  push:
    branches: [codex/shpargalka-action-shotcut]
    paths:
      - video_production/coverr_probe.py
      - .github/workflows/shpargalka-coverr-probe.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python -u video_production/coverr_probe.py
