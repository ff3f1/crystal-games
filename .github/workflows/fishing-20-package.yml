name: Fishing 2.0 signed package
on:
  push:
    branches: [release/fishing-2.0]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android
            games/fish
            store/fish/icons
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r games/fish/. android/app/src/main/assets/
          find android/app/src/main/assets/assets/audio -maxdepth 1 -type f -name '*.mp3' -delete
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp "store/fish/icons/ic_launcher_$d.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
      - name: Load existing signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fishing.jks"
          printf 'KEYSTORE_PATH=%s/fishing.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Assemble RuStore APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle :app:assembleRelease --no-daemon
          -PappId=ru.crystalgames.fishing
          '-PappName=Рыбалка: Клюёт!'
          -PversionCode=2000 -PversionName=2.0.0
          -PadInter=R-M-20269656-1 -PadReward=R-M-20269656-2
      - name: Verify update against APK 1.6
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/fishing-2.0.0.apk
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/fishing-1.6.0.apk" https://raw.githubusercontent.com/ff3f1/crystal-games/builds-fishing-1.6-final/fishing-1.6.0.apk
          printf 'ed5bd295896f6e3c7acd425ccf57bf5613ba23f4a0e23cfde75d0c67f1581a5c  %s/fishing-1.6.0.apk\n' "$RUNNER_TEMP" | sha256sum -c -
          kit=$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)")
          "$kit/apksigner" verify --print-certs output/fishing-2.0.0.apk > output/signature.txt
          "$kit/apksigner" verify --print-certs "$RUNNER_TEMP/fishing-1.6.0.apk" > "$RUNNER_TEMP/fishing-1.6.signature"
          test "$(awk '/certificate SHA-256 digest:/ { print $NF }' output/signature.txt)" = "$(awk '/certificate SHA-256 digest:/ { print $NF }' "$RUNNER_TEMP/fishing-1.6.signature")"
          "$kit/aapt" dump badging output/fishing-2.0.0.apk > output/package.txt
          grep -F "package: name='ru.crystalgames.fishing' versionCode='2000' versionName='2.0.0'" output/package.txt
          sha256sum output/fishing-2.0.0.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-2.0-signed-apk
          path: output/
          retention-days: 14
