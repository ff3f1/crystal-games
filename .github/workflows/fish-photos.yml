name: Prepare Fishing 1.2 photo backgrounds
on:
  push:
    branches: [full-realism-1.2]
    paths:
      - tools/fish_photos.py
      - .github/workflows/fish-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install photo processing tools
        run: python -m pip install pillow requests
      - name: Find licensed photographs, create seasonal backdrops and credits
        run: python tools/fish_photos.py
      - name: Save original, attributed backdrops in release branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add games/fish/assets/bg/*.webp games/fish/assets/assets.js games/fish/assets/PHOTO_CREDITS.md
          if ! git diff --cached --quiet; then
            git commit -m "art(fish): licensed photographic scenery for all 20 waters and seasons"
            git push origin HEAD:full-realism-1.2
          fi
