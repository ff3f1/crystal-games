name: Review real licensed bite and jumping fish footage
on:
  push:
    branches: [codex/shpargalka-action-shotcut]
    paths:
      - video_production/action_contact.py
      - .github/workflows/shpargalka-action-contact.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install requests pillow
      - run: python -u video_production/action_contact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Action-footage-visual-review
          path: video_production/action_review/ALL_ACTION_CONTACT.jpg
          retention-days: 3
