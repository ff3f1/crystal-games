name: Fishing real gameplay promo
on:
  push:
    branches: [codex/fishing-overhaul]
    paths: ["tests/record_fish_promo.py", ".github/workflows/fish-promo.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser, image and video dependencies
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
          ffmpeg -hide_banner -version | head -1
      - name: Record production gameplay and validate H264/AAC
        run: python tests/record_fish_promo.py promo-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-real-gameplay-promo
          path: promo-output/
          if-no-files-found: ignore
