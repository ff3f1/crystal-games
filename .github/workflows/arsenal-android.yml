name: Arsenal Android 0.4.0
on:
  pull_request:
    paths:
      - 'android-arsenal/**'
      - '.github/workflows/arsenal-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: android-arsenal
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify packaged web assets
        working-directory: android-arsenal
        run: |
          python - <<'PY'
          from pathlib import Path
          import zlib
          data=Path('app/src/main/assets/index.html').read_bytes()
          assert len(data)==390784
          assert zlib.crc32(data)&0x2140de30==0x463fa0a2
          print('Embedded photographic assets: verified')
          PY
      - name: Test app data and workflows
        working-directory: android-arsenal
        run: node tests/smoke.cjs
      - name: Real browser photo regression
        working-directory: android-arsenal
        run: |
          npm install --no-save --no-package-lock playwright-core@1.51.1
          node tests/browser.cjs
      - name: Build signed debug APK with Android SDK
        working-directory: android-arsenal
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          cp app/build/outputs/apk/debug/app-debug.apk Arsenal_Rybaka_0.4.0_test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Arsenal_Rybaka_0.4.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Arsenal-Rybaka-0.4.0-TEST-APK
          path: android-arsenal/Arsenal_Rybaka_0.4.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned production APK (real IDs)
        uses: actions/upload-artifact@v4
        with:
          name: Arsenal-Rybaka-0.4.0-UNSIGNED-PRODUCTION
          path: android-arsenal/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
