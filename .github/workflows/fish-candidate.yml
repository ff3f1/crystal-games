name: Fishing candidate APK and AAB
on:
  push:
    branches: [codex/fishing-overhaul]
    paths: ["games/fish/**", "tests/**", ".github/workflows/fish-candidate.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate native artwork
        run: |
          pip install Pillow
          python tests/validate_fish_art.py
          python tests/test_rod_art.py
      - name: Validate fishing physics
        run: |
          node tests/test_fish_physics.js
          node tests/test_fish_input.js
          node tests/test_fish_mechanics.js
          node --test tests/fight-reaction.test.cjs tests/strike-reaction.test.cjs tests/spots.test.cjs tests/spin-detail.test.cjs tests/tutorial-landing.test.cjs
      # The exhaustive browser regression and screenshot audit run in their
      # own Fishing game tests / seasonal scenery workflows. Do not block a
      # signed, UNPUBLISHED phone-testing APK on slow headless GPU runners.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare fishing package only
        run: |
          mkdir -p android/app/src/main/assets
          cp -r games/fish/. android/app/src/main/assets/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp store/fish/icons/ic_launcher_$density.png android/app/src/main/res/mipmap-$density/ic_launcher.png
          done
          echo "CANDIDATE_CODE=2002" >> "$GITHUB_ENV"
      - name: Existing release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Release signing key unavailable; refusing a debug-signed update.'; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build update without publishing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease bundleRelease --no-daemon
          -PappId=ru.crystalgames.fishing
          '-PappName=Рыбалка: Клюёт!'
          -PversionCode=$CANDIDATE_CODE
          -PversionName=2.0.2-test
          -PadInter=R-M-20269656-1
          -PadReward=R-M-20269656-2
      - name: Verify and package
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/fishing-2.0.2-test.apk
          cp android/app/build/outputs/bundle/release/*.aab out/fishing-2.0.2-test.aab
          APK=$(find out -name '*.apk')
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify --print-certs "$APK" > out/signature.txt
          sha256sum out/*.apk out/*.aab > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-candidate
          path: out/
      - name: Make directly downloadable test APK (no RuStore publishing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp out/fishing-2.0.2-test.apk site/
          cp out/SHA256SUMS.txt site/
          cp out/signature.txt site/
          cat > site/README.md <<EOF
          # Рыбалка: Клюёт! 2.0.2-test
          
          Test APK from branch codex/fishing-overhaul.
          Source: ${{ github.sha }}
          Package: ru.crystalgames.fishing
          Version code: 2002
          Signed release build. No store upload.
          
          The sampled reel/drag/snap effects are bundled.
          New optional Wooden Docks and Still Water MP3 files are NOT
          bundled yet. Existing game music is retained.
          EOF
          cd site
          git init -q -b builds-fishing-2.0.2-test
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "Test APK from ${{ github.sha }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" builds-fishing-2.0.2-test
