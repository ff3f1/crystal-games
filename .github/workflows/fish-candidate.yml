name: Fishing candidate APK and AAB
on:
  push:
    branches: [codex/fishing-overhaul]
    paths: [".github/workflows/fish-candidate.yml", ".github/scripts/fish-emulator-smoke.sh"] # Avoid compiling on every small gameplay change
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate native artwork
        run: |
          pip install Pillow
          python tests/validate_fish_art.py
          python tests/test_rod_art.py
      - name: Validate fishing physics
        run: |
          node tests/test_fish_physics.js
          node tests/test_fish_input.js
          node tests/test_fish_foley.cjs
          node tests/test_fish_mechanics.js
          node --test tests/fight-reaction.test.cjs tests/strike-reaction.test.cjs tests/spots.test.cjs tests/spin-detail.test.cjs tests/tutorial-landing.test.cjs
      # The exhaustive browser regression and screenshot audit run in their
      # own Fishing game tests / seasonal scenery workflows. Do not block a
      # signed, UNPUBLISHED phone-testing APK on slow headless GPU runners.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare fishing package only
        run: |
          mkdir -p android/app/src/main/assets
          cp -r games/fish/. android/app/src/main/assets/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp store/fish/icons/ic_launcher_$density.png android/app/src/main/res/mipmap-$density/ic_launcher.png
          done
          echo "CANDIDATE_CODE=2004" >> "$GITHUB_ENV"
      - name: Existing release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Release signing key unavailable; refusing a debug-signed update.'; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build update without publishing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease bundleRelease --no-daemon
          -PappId=ru.crystalgames.fishing
          '-PappName=Рыбалка: Клюёт!'
          -PversionCode=$CANDIDATE_CODE
          -PversionName=2.0.4-test
          -PadInter=R-M-20269656-1
          -PadReward=R-M-20269656-2
      - name: Verify and package
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/fishing-2.0.4-test.apk
          cp android/app/build/outputs/bundle/release/*.aab out/fishing-2.0.4-test.aab
          APK=$(find out -name '*.apk')
          set -euo pipefail
          # Reject HTML landing pages, Git LFS pointers, truncated ZIPs and missing WebView files.
          test "$(stat -c%s "$APK")" -gt 10000000
          unzip -tq "$APK" > out/zip-integrity.txt
          python - "$APK" <<'PY'
          import re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = set(z.namelist())
              required = ('AndroidManifest.xml', 'classes.dex', 'assets/index.html',
                          'assets/js/game.js', 'assets/js/audio.js', 'assets/js/foley-bank.js',
                          'assets/js/main.js', 'assets/js/fight-physics.js', 'assets/js/ui.js')
              missing = [x for x in required if x not in names]
              html = z.read('assets/index.html').decode('utf-8')
              missing += ['assets/' + x for x in re.findall(r'<script\s+src="([^"]+)"', html)
                          if 'assets/' + x not in names]
              if missing: raise SystemExit('Missing WebView game files: ' + repr(missing))
              print('APK ZIP and embedded WebView scripts verified')
          PY
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > out/signature.txt
          grep -qi 'certificate SHA-256 digest: 7a5f80c0bd45b837c6b8c03886dcc1916f5ceacf9b86fbe1b4f8c2aa5ca56347' out/signature.txt
          "$AAPT" dump badging "$APK" > out/package.txt
          grep -q "name='ru.crystalgames.fishing' versionCode='2004'" out/package.txt
          grep -q "launchable-activity: name='ru.crystalgames.shell.MainActivity'" out/package.txt
          (cd out && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo 'ZIP, assets, original release signing key, package and version verified' > out/verification.txt
      - name: Enable hardware virtualization for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch candidate on Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_3a
          avd-name: fishing-smoke
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/fish-emulator-smoke.sh out/fishing-2.0.4-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-candidate-and-emulator-evidence
          path: out/
          if-no-files-found: warn
      # Publish only if signature validation AND emulator installation succeeded.
      - name: Make directly downloadable test APK (no RuStore publishing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp out/fishing-2.0.4-test.apk site/
          cp out/SHA256SUMS.txt site/
          cp out/signature.txt out/package.txt out/verification.txt out/emulator-result.txt site/
          cat > site/README.md <<EOF
          # Рыбалка: Клюёт! 2.0.4-test

          **Direct APK download (not a GitHub source tree page):**
          https://raw.githubusercontent.com/${{ github.repository }}/builds-fishing-2.0.4-test/fishing-2.0.4-test.apk

          Test APK from branch codex/fishing-overhaul.
          Source: ${{ github.sha }}
          Package: ru.crystalgames.fishing
          Version code: 2004
          Signed with the original release certificate; Android emulator install/launch tested. No store upload.

          The sampled reel/drag/snap effects are bundled.
          New optional Wooden Docks and Still Water MP3 files are NOT
          bundled yet. Existing game music is retained.
          EOF
          cd site
          git init -q -b builds-fishing-2.0.4-test
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "Test APK from ${{ github.sha }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" builds-fishing-2.0.4-test
