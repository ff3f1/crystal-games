name: Fishing game tests

on:
  push:
    branches:
      - "feature/fishing-expeditions-*"
    paths:
      - "games/fish/**"
      - "tests/test_fish.py"
      - ".github/workflows/fish-tests.yml"
  pull_request:
    paths:
      - "games/fish/**"
      - "tests/test_fish.py"
      - ".github/workflows/fish-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser gameplay regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run fishing gameplay tests
        run: |
          mkdir -p test-output
          python tests/test_fish.py test-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-browser-screenshots
          path: test-output/
          if-no-files-found: ignore
