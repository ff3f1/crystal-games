name: Fishing game tests

on:
  push:
    branches:
      - main
      - codex/fishing-overhaul
      - "feature/fishing-expeditions-*"
    paths:
      - "games/fish/**"
      - "tests/test_fish.py"
      - "tests/record_fish_promo.py"
      - ".github/workflows/fish-tests.yml"
  pull_request:
    paths:
      - "games/fish/**"
      - "tests/test_fish.py"
      - "tests/record_fish_promo.py"
      - "tests/promo_voiceover.txt"
      - "tests/promo_captions.srt"
      - ".github/workflows/fish-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser gameplay regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
      - name: Run fishing gameplay tests
        run: |
          mkdir -p test-output
          node tests/test_fish_input.js
          node tests/test_fish_mechanics.js
          node --test tests/fight-reaction.test.cjs tests/strike-reaction.test.cjs tests/spots.test.cjs tests/spin-detail.test.cjs tests/tutorial-landing.test.cjs
          python tests/validate_fish_art.py
          python tests/test_rod_art.py
          python tests/test_fish.py test-output
          python tests/test_fish_renderer.py test-output
          python tests/test_fish_atmosphere.py test-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-browser-regression-screenshots
          path: test-output/
          if-no-files-found: ignore
