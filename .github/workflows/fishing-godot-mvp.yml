name: Fishing Godot MVP — Android debug APK

on:
  push:
    branches:
      - prototype/fishing-godot-mvp
    paths:
      - "games/fishing-godot-mvp/**"
      - ".github/workflows/fishing-godot-mvp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fishing-godot-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Godot 4.5.1 — validate and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Godot editor and export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.5.1-stable
          export-templates: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download CC0 art (meshes, PBR terrain and sky panorama)
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 games/fishing-godot-mvp/tools/fetch_assets.py
          python3 games/fishing-godot-mvp/tools/build_fish_textures.py
          python3 games/fishing-godot-mvp/tools/build_sfx.py
          test -s games/fishing-godot-mvp/assets/audio/lake_water.wav
          test -s games/fishing-godot-mvp/assets/audio/drag.wav
          test -s games/fishing-godot-mvp/assets/textures/fish_pike_normal.png
          test -s games/fishing-godot-mvp/assets/textures/fish_perch_albedo.png
          test -s games/fishing-godot-mvp/assets/textures/fish_crucian_albedo.png
          du -sh games/fishing-godot-mvp/assets
          test -s games/fishing-godot-mvp/assets/models/rod.glb
          test -s games/fishing-godot-mvp/assets/textures/shore_diffuse.jpg

      - name: Convert glTF quantized meshes for Godot compatibility
        run: |
          npm install -g @gltf-transform/cli@4.5.0
          for name in rod perch carp trout dock boat chair tackle cooler cattails lilies float_set lure net sign rock_cluster; do
            input="games/fishing-godot-mvp/assets/models/${name}.glb"
            output="games/fishing-godot-mvp/assets/models/${name}.converted.glb"
            gltf-transform dequantize "$input" "$output"
            test -s "$output"
            mv "$output" "$input"
          done

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path games/fishing-godot-mvp --editor --quit 2>&1 | tee godot-import.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:' godot-import.log; then
            echo "::error::Godot import emitted an error; refusing broken APK"
            exit 1
          fi

      - name: Run headless scene smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path games/fishing-godot-mvp --script res://scripts/smoke_start.gd 2>&1 | tee godot-scene.log
          grep -q "FISHING_START_OK" godot-scene.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:' godot-scene.log \
             | grep -v -E 'ERROR: [0-9]+ resources still in use at exit'; then
            echo "::error::Game scene failed headless smoke test"
            exit 1
          fi

      - name: Isolated cast / fish / drag / framerate physics tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path games/fishing-godot-mvp --script res://scripts/smoke_physics.gd 2>&1 | tee godot-physics.log
          grep -q "FISHING_PHYSICS_OK" godot-physics.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:|FISHING_PHYSICS_FAIL:' godot-physics.log; then
            echo "::error::Fishing physics QA failed"
            exit 1
          fi

      - name: End-to-end fishing gameplay smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path games/fishing-godot-mvp --script res://scripts/smoke_game.gd 2>&1 | tee godot-gameplay.log
          grep -q "FISHING_MVP_SMOKE_OK" godot-gameplay.log
          # Godot 4.5 may report retained texture/audio cache at process exit
          # after all assertions pass; these are teardown diagnostics, not
          # script/runtime errors. Every other ERROR remains fatal.
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:|FISHING_MVP_SMOKE_FAIL:' godot-gameplay.log \
             | grep -v -E 'ERROR: [0-9]+ resources still in use at exit'; then
            echo "::error::Fishing gameplay scenario failed"
            exit 1
          fi

      - name: Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;35.0.0" "platforms;android-35" >/dev/null

      - name: Configure Godot Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/fishing-mvp-debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Fishing MVP,C=RU"

      - name: Export signed debug APK (arm64)
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/fishing-mvp-debug.keystore"
          mkdir -p games/fishing-godot-mvp/build
          godot --headless --path games/fishing-godot-mvp \
            --export-debug Android \
            "$GITHUB_WORKSPACE/games/fishing-godot-mvp/build/fishing-first-cast-debug.apk"
          test -s games/fishing-godot-mvp/build/fishing-first-cast-debug.apk
          ls -lh games/fishing-godot-mvp/build/*.apk

      - name: Capture real in-game screenshot
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path games/fishing-godot-mvp \
            --resolution 1280x720 \
            --script res://scripts/capture.gd
          test -s games/fishing-godot-mvp/build/scene-preview.png

      - name: Verify fullscreen 20:9 game image has no pillarboxing
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 2400x1080x24" \
            godot --path games/fishing-godot-mvp \
            --resolution 2400x1080 \
            --script res://scripts/capture_wide.gd 2>&1 | tee wide-screen.log
          grep -q "ULTRAWIDE_20_9_OK" wide-screen.log
          test -s games/fishing-godot-mvp/build/ultrawide-preview.png

      - name: Capture 3D trophy preview
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path games/fishing-godot-mvp \
            --resolution 1280x720 \
            --script res://scripts/capture_result.gd
          test -s games/fishing-godot-mvp/build/trophy-preview.png

      - name: Upload installable prototype
        uses: actions/upload-artifact@v4
        with:
          name: fishing-first-cast-godot-debug-apk
          path: |
            games/fishing-godot-mvp/build/*.apk
            games/fishing-godot-mvp/build/scene-preview.png
            games/fishing-godot-mvp/build/gameplay-preview.png
            games/fishing-godot-mvp/build/ultrawide-preview.png
            games/fishing-godot-mvp/build/settings-preview.png
            games/fishing-godot-mvp/build/journal-preview.png
            games/fishing-godot-mvp/build/trophy-preview.png
            games/fishing-godot-mvp/assets/textures/sky_panorama.jpg
          if-no-files-found: error
          retention-days: 14
