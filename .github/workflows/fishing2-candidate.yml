name: Fishing 2.0 separate Android test APK
on:
  push:
    branches: [codex/fishing-2]
    paths:
      - "games/fish2/**"
      - ".github/workflows/fishing2-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare independent game and six visual scenes
        run: |
          set -eux
          ASSET=android/app/src/main/assets
          mkdir -p "$ASSET/assets/scenes" "$ASSET/assets/fish" "$ASSET/assets/equipment" "$ASSET/assets/rods"
          cp games/fish2/index.html games/fish2/style.css games/fish2/game.js "$ASSET/"
          cp games/fish2/assets/scenes/pond_summer.webp "$ASSET/assets/scenes/pond_summer.webp"
          cp games/fish2/assets/scenes/pond_winter.webp "$ASSET/assets/scenes/pond_winter.webp"
          cp games/fish2/assets/scenes/river_summer.webp "$ASSET/assets/scenes/river_summer.webp"
          cp games/fish2/assets/scenes/river_winter.webp "$ASSET/assets/scenes/river_winter.webp"
          cp games/fish2/assets/scenes/sea_summer.webp "$ASSET/assets/scenes/sea_summer.webp"
          cp games/fish2/assets/scenes/sea_winter.webp "$ASSET/assets/scenes/sea_winter.webp"
          cp games/fish/assets/fish-hd/*.webp "$ASSET/assets/fish/"
          cp games/fish/assets/equipment/float_round.png "$ASSET/assets/equipment/"
          cp games/fish2/assets/rods/*.webp "$ASSET/assets/rods/"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp store/fish/icons/ic_launcher_$density.png android/app/src/main/res/mipmap-$density/ic_launcher.png
          done
          test "$(find "$ASSET/assets/scenes" -name '*.webp' | wc -l)" -eq 6
          node --check "$ASSET/game.js"
      - name: Load existing release signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Release key unavailable'; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the standalone Android app
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease --no-daemon
          -PappId=ru.crystalgames.fishing2
          '-PappName=Рыбалка: Клюёт! 2.0'
          -PversionCode=201
          -PversionName=2.0.1
      - name: Verify package and signature
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk output/fishing-2.0.1.apk
          APK=output/fishing-2.0.1.apk
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$TOOLS_DIR" verify --print-certs "$APK" > output/signature.txt
          "$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)" dump badging "$APK" > output/package.txt
          grep "package: name='ru.crystalgames.fishing2'" output/package.txt
          sha256sum "$APK" > output/SHA256SUMS.txt
          cp "$(dirname "$TOOLS_DIR")/lib/apksigner.jar" output/apksigner.jar
          cp "$(dirname "$TOOLS_DIR")/zipalign" output/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-2.0-test
          path: output/
          retention-days: 14
