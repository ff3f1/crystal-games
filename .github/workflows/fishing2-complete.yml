name: Fishing 2.1 APK and Android launch check
on:
  push:
    branches: [codex/fishing2-complete]
    paths: ['games/fish2/**', '.github/workflows/fishing2-complete.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline game shell
        run: |
          cp games/fish2/android/build.gradle android/app/build.gradle
          cp games/fish2/android/MainActivity.java android/app/src/main/java/ru/crystalgames/shell/MainActivity.java
          cp games/fish2/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/assets
          cp games/fish2/index.html games/fish2/style.css games/fish2/game.js games/fish2/audio.js android/app/src/main/assets/
          cp -r games/fish2/assets android/app/src/main/assets/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp store/fish/icons/ic_launcher_$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          node --check games/fish2/game.js
          node --check games/fish2/audio.js
          # The common shell's AppCompat theme is unused by this standalone Activity.
          rm android/app/src/main/res/values/styles.xml
      - name: Use the same signing key as 2.0.1
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Check package, signature and embedded assets
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk output/fishing-2.1.0.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs output/fishing-2.1.0.apk > output/signature.txt
          "$(dirname "$SIGNER")/aapt" dump badging output/fishing-2.1.0.apk > output/package.txt
          grep "package: name='ru.crystalgames.fishing2'.*versionCode='210'" output/package.txt
          sha256sum output/fishing-2.1.0.apk > output/SHA256SUMS.txt
          cp "$(dirname "$SIGNER")/lib/apksigner.jar" output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-2.1-apk
          path: output/
          retention-days: 14
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install output/fishing-2.1.0.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n ru.crystalgames.fishing2/ru.crystalgames.shell.MainActivity
            sleep 12
            python3 tests/android_fishing2_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-2.1-android-check
          path: output/
          retention-days: 14
