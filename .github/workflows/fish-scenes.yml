name: Fishing full seasonal scenery audit
on:
  push:
    branches: [codex/fishing-overhaul]
    paths:
      - "games/fish/**"
      - "tests/test_fish_scenes.py"
      - ".github/workflows/fish-scenes.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenery:
    name: Real screenshots — 20 waters, 2 seasons, 2 weather variants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and image tools
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
      - name: Capture and validate all 80 landscape views
        run: python tests/test_fish_scenes.py scene-output
      - name: Upload full season-by-season evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-80-location-screenshots
          path: scene-output/
          if-no-files-found: ignore
