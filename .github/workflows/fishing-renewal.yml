name: Fishing 1.6 update from 1.0.10
on:
  push:
    branches: [codex/fishing-solid-update]
    paths: ['games/fish/**','android/**','tests/**','tools/**','.github/workflows/fishing-renewal.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install audio and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Browser gameplay, migration and reward checks
        run: |
          mkdir -p work/browser
          npm install --prefix "$RUNNER_TEMP/checks" playwright@1.56.1
          python3 -m http.server 8080 --directory games/fish > work/browser/http.log 2>&1 &
          NODE_PATH="$RUNNER_TEMP/checks/node_modules" FISH_URL=http://127.0.0.1:8080 CHROME_PATH=/usr/bin/google-chrome FISH_OUT=work/browser node tests/test_fishing_renewal.cjs | tee work/browser/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-1.6-browser-checks
          path: work/browser/
      - name: Prepare the original app, assets and advertising configuration
        run: |
          mkdir -p android/app/src/main/assets
          cp -r games/fish/. android/app/src/main/assets/
          find android/app/src/main/assets/assets/audio -maxdepth 1 -type f -name '*.mp3' -delete
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp store/fish/icons/ic_launcher_$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          node --check games/fish/js/game.js
          node --check games/fish/js/renewal.js
          python3 tests/check_fishing_audio.py
      - name: Require the existing release key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK and AAB for the original RuStore package
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          gradle assembleRelease bundleRelease --no-daemon
          -PappId=ru.crystalgames.fishing
          '-PappName=Рыбалка: Клюёт!'
          -PversionCode=1600 -PversionName=1.6.0
          -PadInter=R-M-20269656-1 -PadReward=R-M-20269656-2
      - name: Download the exact original 1.0.10 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/original output
          gh api repos/ff3f1/crystal-games/actions/artifacts/14164440212/zip > work/original.zip
          unzip -j work/original.zip fish-10.apk -d work/original
      - name: Verify update identity, signing and content
        run: |
          cp android/app/build/outputs/apk/release/*.apk output/fishing-1.6.0.apk
          cp android/app/build/outputs/bundle/release/*.aab output/fishing-1.6.0.aab
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs output/fishing-1.6.0.apk > output/signature.txt
          "$SIGNER" verify --print-certs work/original/fish-10.apk > output/original-signature.txt
          test "$(grep 'certificate SHA-256 digest:' output/signature.txt | head -1 | awk '{print $NF}')" = "$(grep 'certificate SHA-256 digest:' output/original-signature.txt | head -1 | awk '{print $NF}')"
          "$(dirname "$SIGNER")/aapt" dump badging output/fishing-1.6.0.apk > output/package.txt
          "$(dirname "$SIGNER")/aapt" dump badging work/original/fish-10.apk > output/original-package.txt
          grep "package: name='ru.crystalgames.fishing' versionCode='1600' versionName='1.6.0'" output/package.txt
          grep "versionName='1.0.10'" output/original-package.txt
          cp "$(dirname "$SIGNER")/lib/apksigner.jar" output/apksigner.jar
          sha256sum output/fishing-1.6.0.apk output/fishing-1.6.0.aab > output/SHA256SUMS.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('output/fishing-1.6.0.apk') as z:
              names=z.namelist()
              assert len([n for n in names if n.startswith('assets/assets/fish-hd/') and n.endswith('.webp')])==62
              assert len([n for n in names if n.startswith('assets/assets/base/') and n.endswith('.webp')])==20
              assert all('assets/assets/audio/renewal/'+n+'.mp3' in names for n in ['dawn','winter','night','birds','splash','reel'])
              dex=b''.join(z.read(n) for n in names if n.endswith('.dex'))
              assert b'R-M-20269656-1' in dex and b'R-M-20269656-2' in dex
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-1.6-signed-update
          path: output/
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation over 1.0.10 and offline Android behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell svc wifi disable
            adb shell svc data disable
            adb install work/original/fish-10.apk
            # Block network for this app UID before first launch. This prevents
            # production ad impressions during automated device tests.
            uid=$(adb shell dumpsys package ru.crystalgames.fishing | sed -n 's/.*userId=\([0-9]*\).*/\1/p' | head -1 | tr -d '\r')
            test -n "$uid"
            adb shell iptables -I OUTPUT -m owner --uid-owner "$uid" -j REJECT
            adb shell ip6tables -I OUTPUT -m owner --uid-owner "$uid" -j REJECT || true
            adb shell am start -W -n ru.crystalgames.fishing/ru.crystalgames.shell.MainActivity
            sleep 8
            adb shell am force-stop ru.crystalgames.fishing
            adb install -r output/fishing-1.6.0.apk
            adb logcat -c
            adb shell am start -W -n ru.crystalgames.fishing/ru.crystalgames.shell.MainActivity
            sleep 12
            python3 tests/android_fishing_renewal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-1.6-android-checks
          path: output/
          retention-days: 30

      - name: Package real Android screenshots for RuStore
        run: |
          mkdir -p output/rustore
          for image in output/store-screenshots/*.png; do
            name=$(basename "$image" .png)
            ffmpeg -v error -y -i "$image" -frames:v 1 -q:v 2 -pix_fmt yuvj444p "output/rustore/$name.jpg"
            dimensions=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "output/rustore/$name.jpg")
            test "$dimensions" = '1080x1920'
            test "$(stat -c%s "output/rustore/$name.jpg")" -lt 3000000
          done
          (cd output/rustore && zip -q ../fishing-1.6-rustore-screenshots.zip ./*.jpg)
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-1.6-store-screenshots
          path: |
            output/fishing-1.6-rustore-screenshots.zip
            output/rustore/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: fishing-1.6-apk
          path: output/fishing-1.6.0.apk
          retention-days: 30
