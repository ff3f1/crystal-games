name: Inspect new European pike fishing action footage
on:
  push:
    branches: [codex/shpargalka-real-story-cut]
    paths: [video_production/european_action_audit.py, .github/workflows/shpargalka-euro-audit.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: video_production}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -q requests pillow imageio-ffmpeg
      - run: python -u video_production/european_action_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: European-Pike-Catch-Audit
          path: video_production/real_action_audit/CONTACT.jpg
          retention-days: 2
