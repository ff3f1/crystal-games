name: Build games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: RuStore — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: BLOCK
            dir: block
            name: Кристальные блоки
            appId: ru.crystalgames.blocks
            adInter: R-M-20230574-1
            adReward: R-M-20230574-2
          - key: PATH
            dir: path
            name: Нарисуй путь
            appId: ru.crystalgames.drawpath
            adInter: R-M-20230578-1
            adReward: R-M-20230578-2
          - key: FISH
            dir: fish
            name: "Рыбалка: Клюёт!"
            appId: ru.crystalgames.fishing
            # демо-блоки Яндекса, пока в кабинете РСЯ не созданы свои
            adInter: demo-interstitial-yandex
            adReward: demo-rewarded-yandex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже установлен на раннерах GitHub (ANDROID_HOME)
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Положить игру и иконки в проект
        run: |
          mkdir -p android/app/src/main/assets
          cp -r games/${{ matrix.dir }}/. android/app/src/main/assets/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp store/${{ matrix.dir }}/icons/ic_launcher_$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан — сборка подписана отладочным ключом (для RuStore не годится)"
          fi

      - name: Сборка APK и AAB
        working-directory: android
        env:
          LC_ALL: C.UTF-8
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle assembleRelease bundleRelease --no-daemon
          -PappId=${{ matrix.appId }}
          "-PappName=${{ matrix.name }}"
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}
          -PadInter=${{ matrix.adInter }}
          -PadReward=${{ matrix.adReward }}

      - name: Понятные имена файлов
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/${{ matrix.dir }}-${{ github.run_number }}.apk
          cp android/app/build/outputs/bundle/release/*.aab out/${{ matrix.dir }}-${{ github.run_number }}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: rustore-${{ matrix.dir }}
          path: out/*

  vk:
    name: VK — архивы игр
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Собрать архивы с VK Bridge
        run: |
          npm pack @vkontakte/vk-bridge
          tar xzf vkontakte-vk-bridge-*.tgz
          BR=$(ls package/dist/browser.min.js 2>/dev/null || ls package/dist/*.min.js | head -1)
          mkdir -p out
          for g in block path fish; do
            mkdir -p build/$g
            cp -r games/$g/. build/$g/
            cp "$BR" build/$g/vk-bridge.min.js
            (cd build/$g && zip -r ../../out/vk-$g.zip .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vk-games
          path: out/*.zip

  builds:
    name: Готовые файлы в ветку builds
    needs: [android, vk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Сохранить в ветку builds
        run: |
          mkdir -p site && find dl -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.zip' \) -exec cp {} site/ \;
          cd site && ls -la
          git init -q -b builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Сборка ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
