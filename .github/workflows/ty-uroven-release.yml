name: TY UROVEN release verification
on:
  push:
    branches: [feat/ty-uroven-release]
    paths: ['ty-uroven/**', '.github/workflows/ty-uroven-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ty-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test ty-uroven/tests/core.test.cjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright==1.56.0 pillow==12.0.0
      - run: python -m playwright install --with-deps chromium
      - run: python ty-uroven/tests/ui_test.py ty-uroven/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ty-uroven-ui-evidence
          path: ty-uroven/test-results
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build and lint isolated application
        working-directory: ty-uroven
        run: gradle assembleRelease assembleDebug assembleDebugAndroidTest lintRelease --no-daemon --stacktrace
      - name: Name APK and record signing certificate
        run: |
          mkdir -p ty-uroven/artifacts
          cp ty-uroven/app/build/outputs/apk/release/app-release.apk ty-uroven/artifacts/ty-uroven-1.0.0.apk
          sha256sum ty-uroven/artifacts/*.apk > ty-uroven/artifacts/SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ty-uroven/artifacts/ty-uroven-1.0.0.apk > ty-uroven/artifacts/signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ty-uroven-installable-apk
          path: ty-uroven/artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 packaged offline smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            cd ty-uroven && gradle connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Collect on-device screenshots and logs
        if: always()
        run: |
          mkdir -p ty-uroven/device-evidence
          adb pull /sdcard/Android/data/ru.uroven.adventurepreview/files/screenshots ty-uroven/device-evidence/ || true
          adb logcat -d > ty-uroven/device-evidence/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ty-uroven-android-evidence
          path: |
            ty-uroven/device-evidence
            ty-uroven/app/build/reports
            ty-uroven/app/build/outputs/androidTest-results
